/* ===================== Rom (leksjoner) ===================== */
function playRoom(f, r) {
  const cards = r.cards, P = { i: 0, qv: null, xp: 0, gain: 0, combo: 0, end: false, first: S.done[r.id] == null };
  const ov = { label: `${f.n}. etasje: ${r.t}` };
  const cur = () => cards[P.i];
  const say = c => Aud.speak([c.h, c.b, c.ex ? 'I praksis. ' + c.ex : '']);
  const load = () => { const c = cur(); P.gain = 0; P.qv = c.ty ? makeQ(c, { onDone: answered, repaint: () => Ov.paint(), alive: () => Ov.cur === ov }) : null; };
  const autoSay = () => { const c = cur(), at = P.i; if (c.ty || !S.set.auto || !Aud.ok) return; say(c).then(() => { if (Ov.cur === ov && P.i === at && S.set.auto && !P.end) step(); }).catch(() => {}); };
  function answered(res) { const q = cur(), wasNew = !S.q[q.id]; if (res.ok) P.combo++; else P.combo = 0; S.stat.combo = Math.max(S.stat.combo, P.combo); P.gain = Math.round(5 * res.frac); P.xp += P.gain; addXP(P.gain); recordQ(q, res);
    if (q.ty === 'order' && q.items.length === 8 && res.ok && wasNew) award('kotter'); beep(res.ok ? 'ok' : 'bad'); commit(); Ov.paint(); const nx = $('[data-act="next"]', Ov.el); if (nx) nx.focus({ preventScroll: true }); }
  function step() { Aud.stop(); P.i++; if (P.i >= cards.length) { P.end = true; const g = P.first ? 20 : 5; P.xp += g; addXP(g); if (P.first) S.done[r.id] = 1; commit(); beep('lvl'); Ov.fresh(); return; } load(); Ov.fresh(); autoSay(); }
  ov.audio = () => { const b = $('[data-act="say"]', Ov.el); if (!b) return; const on = Aud.st !== 'idle'; b.innerHTML = icon(on ? 'stop' : 'speaker'); b.setAttribute('aria-label', on ? 'Stopp opplesningen' : 'Les opp kortet'); b.classList.toggle('on', on); };
  ov.render = () => {
    if (P.end) { const ri = f.rooms.indexOf(r), nx = f.rooms[ri + 1];
      return ovTop(`<strong>${esc(r.t)}</strong>`) + `<div class="ov-body" tabindex="-1"><div class="col end"><p class="lamp" aria-hidden="true"><i></i></p><h2>${P.first ? 'Et nytt vindu lyser' : 'Rommet er repetert'}</h2><p class="xpline">${icon('bolt', 18)} +${P.xp} XP</p>
        <h3>Dette tar du med deg</h3><ul class="take">${cards.filter(c => c.h).map(c => `<li>${esc(c.h)}</li>`).join('')}</ul></div></div>
        <div class="ov-foot">${nx ? `<button class="btn wide" data-act="nextroom">Neste rom: ${esc(nx.t)}</button>` : `<button class="btn wide" data-act="tocase">Prøv casen: ${esc(f.kase.t)}</button>`}<button class="btn ghost wide" data-act="close">Tilbake til etasjen</button></div>`; }
    const c = cur(), qv = P.qv, last = P.i === cards.length - 1;
    const segs = `<div class="segs" role="progressbar" aria-valuemin="0" aria-valuemax="${cards.length}" aria-valuenow="${P.i + 1}" aria-label="Kort ${P.i + 1} av ${cards.length}">${cards.map((x, i) => `<i class="${i < P.i ? 'on' : i === P.i ? 'cur' : ''}"></i>`).join('')}</div>`;
    const tools = c.ty ? '' : `<button class="ib need-audio${Aud.st !== 'idle' ? ' on' : ''}" data-act="say" aria-label="${Aud.st !== 'idle' ? 'Stopp opplesningen' : 'Les opp kortet'}">${icon(Aud.st !== 'idle' ? 'stop' : 'speaker')}</button><button class="tg need-audio${S.set.auto ? ' on' : ''}" data-act="auto" aria-pressed="${S.set.auto}">Les alt</button>`;

      : `<article class="kort"><h2>${esc(c.h)}</h2><p>${md(c.b)}</p>${c.fig ? modelHTML(c.fig) : ''}${c.ex ? `<div class="praksis"><p class="lbl">I praksis</p><p>${md(c.ex)}</p></div>` : ''}${c.src ? `<p class="kilde">${md(c.src)}</p>` : ''}<p><button class="btn quiet need-ai" data-act="ask">${icon('chat', 18)} Spør veilederen om dette</button></p></article>`;
    const foot = c.ty ? (qv.st.done ? `<button class="btn wide" data-act="next">${last ? 'Fullfør rommet' : 'Videre'}</button>` : qv.foot()) : `<button class="btn wide" data-act="next">${last ? 'Fullfør rommet' : 'Videre'}</button>`;

  };

    if (a === 'auto') { S.set.auto = !S.set.auto; save(); el.classList.toggle('on', S.set.auto); el.setAttribute('aria-pressed', S.set.auto); if (S.set.auto) autoSay(); else Aud.stop(); return; }
    if (a === 'ask') { const c = cur(); return openTutor(`${c.h}. ${plain(c.b)}`); }
    if (a === 'nextroom') { const nx = f.rooms[f.rooms.indexOf(r) + 1]; Ov.close(true); return playRoom(f, nx); }
    if (a === 'tocase') { Ov.close(true); return playCase(f.kase, { key: f.id + 'k', f }); }
    if (P.qv) P.qv.act(a, el);
  };
  load(); Ov.open(ov); autoSay();
}

/* Modell med klikkbare deler, knapper og forklaring */
function modelHTML(id, sel) {
  const m = MODELS[id], cur = m.parts.find(p => p[0] === sel);
  return `<div class="mbox" data-model="${id}">
    <figure class="modell"><div class="mwrap">${drawModel(id).replace(new RegExp(`data-part="${sel}"`), `data-part="${sel}" data-on="1"`)}</div>

    <div class="mchips">${m.parts.map(p => `<button class="chipb${p[0] === sel ? ' on' : ''}" data-mp="${p[0]}">${esc(p[1])}</button>`).join('')}</div>
    <div class="minfo" aria-live="polite">${cur ? `<h3>${esc(cur[1])}</h3><p>${esc(cur[2])}</p>` : `<p class="dim">Trykk på en del av figuren for å se hva den betyr.</p>`}</div>
  </div>`;
}
function selectPart(boxEl, part) {
  if (!boxEl) return;
  const m = MODELS[boxEl.dataset.model], cur = m.parts.find(p => p[0] === part); if (!cur) return;
  boxEl.querySelectorAll('.mp').forEach(g => { if (g.dataset.part === part) g.setAttribute('data-on', '1'); else g.removeAttribute('data-on'); });
  boxEl.querySelectorAll('.chipb').forEach(b => b.classList.toggle('on', b.dataset.mp === part));
  const info = boxEl.querySelector('.minfo'); info.innerHTML = `<h3>${esc(cur[1])}</h3><p>${esc(cur[2])}</p>`;
  if (!S.seen['m:' + boxEl.dataset.model + ':' + part]) { S.seen['m:' + boxEl.dataset.model + ':' + part] = 1; save(); }
}

/* ===================== Caser ===================== */
function playCase(k, o = {}) {
  const P = { i: -1, pts: 0, pick: null, order: k.steps.map(s => shuffle(s.opts.map((x, i) => i))), end: false, xp: 0 };
  const ov = { label: 'Case: ' + k.t };
  const lab = p => p === 2 ? 'Sterkt valg' : p === 1 ? 'Greit valg' : 'Risikabelt valg';
  ov.render = () => {
    if (P.i < 0) return ovTop(`<strong>Case</strong>`) + `<div class="ov-body" tabindex="-1"><div class="col"><article class="kort"><p class="zl">${o.f ? `${o.f.n}. etasje, ${esc(o.f.t)}` : 'Laget av veilederen'}</p><h2>${esc(k.t)}</h2><p>${md(k.intro)}</p>
      <p class="dim">Tre valg. Etter hvert valg ser du hva som skjedde, og hvilken teori som forklarer det.</p></article></div></div><div class="ov-foot"><button class="btn wide" data-act="next">Start casen</button></div>`;
    if (P.end) { const lvl = P.pts <= 2 ? 0 : P.pts <= 4 ? 1 : 2;
      return ovTop(`<strong>${esc(k.t)}</strong>`) + `<div class="ov-body" tabindex="-1"><div class="col end"><p class="bigno">${P.pts}<span> av 6 poeng</span></p><h2>${['Skarvøy lærte lite denne gangen', 'Brukbart levert', 'Sterkt levert'][lvl]}</h2><p>${md(k.out[lvl])}</p><p class="xpline">${icon('bolt', 18)} +${P.xp} XP</p>
        <h3>Teorien bak</h3><ul class="take">${k.steps.map(s => `<li>${md(s.th)}</li>`).join('')}</ul></div></div><div class="ov-foot"><button class="btn wide" data-act="close">Ferdig</button><button class="btn ghost wide" data-act="again">Prøv andre valg</button></div>`; }
    const s = k.steps[P.i], done = P.pick != null, ch = done ? s.opts[P.pick] : null;
    return ovTop(progBar(P.i + (done ? 1 : 0), 3), `<span class="cnt">${P.i + 1}/3</span>`) + `<div class="ov-body" tabindex="-1"><div class="col"><h2 class="qq">${md(s.s)}</h2>
      <div class="opts">${P.order[P.i].map(ix => `<button class="opt${done ? (P.pick === ix ? ' p' + s.opts[ix][1] : ' dimd') : ''}" data-act="choose" data-i="${ix}"${done ? ' disabled' : ''}><span>${md(s.opts[ix][0])}</span></button>`).join('')}</div>
      ${done ? `<div class="fb p${ch[1]}" role="status"><p class="fbh"><strong>${lab(ch[1])}</strong><span class="gain">${ch[1]} av 2 poeng</span></p><p>${md(ch[2])}</p></div>
        <div class="teori"><p class="lbl">Teorien bak</p><p>${md(s.th)}</p></div>
        <details class="andre"><summary>Se hva de andre valgene ville gitt</summary>${s.opts.map((x, ix) => ix === P.pick ? '' : `<p><strong>${md(x[0])}</strong> ${lab(x[1])}. ${md(x[2])}</p>`).join('')}</details>` : ''}</div></div>
      <div class="ov-foot">${done ? `<button class="btn wide" data-act="next">${P.i < 2 ? 'Videre' : 'Se utfallet'}</button>` : `<p class="hint c">Velg det du ville gjort.</p>`}</div>`;
  };
  ov.act = (a, el) => {
    if (a === 'choose' && P.pick == null && P.i >= 0) { P.pick = +el.dataset.i; const p = k.steps[P.i].opts[P.pick][1]; P.pts += p; beep(p ? 'ok' : 'bad'); Ov.paint(); const nx = $('[data-act="next"]', Ov.el); nx && nx.focus({ preventScroll: true }); const fb = $('.fb', Ov.el); fb && fb.scrollIntoView && fb.scrollIntoView({ block: 'nearest' }); }
    else if (a === 'next') { P.i++; P.pick = null; if (P.i >= k.steps.length) { P.end = true; const first = o.key ? S.done[o.key] == null : true; P.xp = (first ? 20 : 8) + P.pts * 5; addXP(P.xp); if (o.key) S.done[o.key] = Math.max(S.done[o.key] ?? 0, P.pts); commit(); beep('lvl'); } Ov.fresh(); }
    else if (a === 'again') { Ov.close(true); playCase(k, o); }
  };
  Ov.cur ? Ov.swap(ov) : Ov.open(ov);
}

let SVT = 0; const saveSoon = () => { clearTimeout(SVT); SVT = setTimeout(save, 700); };
function openReflect(f) {
  const kx = f.id + 'x', km = f.id + 'm', ov = { label: 'Refleksjon og feltoppdrag' };
  ov.render = () => ovTop(`<strong>${f.n}. etasje, ${esc(f.t)}</strong>`) + `<div class="ov-body" tabindex="-1"><div class="col">
    <article class="kort"><h2>Refleksjon</h2><p>${esc(f.refl)}</p>
      <label class="lbl" for="rf">Ditt notat</label><textarea class="ta" id="rf" rows="6" data-in="note" data-k="${kx}" maxlength="4000">${esc(S.notes[kx] || '')}</textarea>
      <p class="rowb"><button class="btn" data-act="saveref">Lagre refleksjonen</button></p></article>
    <article class="kort"><h2>Feltoppdrag</h2><p>${esc(f.mission)}</p>
      <label class="lbl" for="ms">Hva fant du?</label><textarea class="ta" id="ms" rows="4" data-in="note" data-k="${km}" maxlength="4000">${esc(S.notes[km] || '')}</textarea>
      <label class="sw"><input type="checkbox" id="msd" data-in="mission"${S.seen['mis:' + f.id] ? ' checked disabled' : ''}><span>Jeg har gjennomført feltoppdraget</span></label></article>
    <p class="dim">Notatene lagres sammen med framdriften din og samles i refleksjonsloggen under Profil.</p></div></div>`;
  ov.input = (n, el) => {
    if (n === 'note') { S.notes[el.dataset.k] = el.value.slice(0, 4000); saveSoon(); }
    else if (n === 'mission' && el.checked && !S.seen['mis:' + f.id]) { S.seen['mis:' + f.id] = 1; S.stat.mis++; addXP(40); if (S.done[kx] == null) S.done[kx] = 1; toast('Feltoppdrag gjennomført. +40 XP', 'boots'); commit(); el.disabled = true; }
  };
  ov.act = a => {
    if (a === 'saveref') { if ((S.notes[kx] || '').trim().length < 20) return toast('Skriv noen setninger først.', 'pen');
      if (!S.seen['ref:' + f.id]) { S.seen['ref:' + f.id] = 1; S.stat.refl++; addXP(25); toast('Refleksjonen er lagret. +25 XP', 'pen'); } else toast('Lagret.', 'check');
      if (S.done[kx] == null) S.done[kx] = 1; commit(); }
  };
  ov.onClose = () => { clearTimeout(SVT); save(); };
  Ov.open(ov);
}

    else if (a === 'lensend') { P.stage = 2; const first = S.done[l.id] == null; P.xp = (first ? 30 : 10) + Math.round(P.res.frac * 6) * 5; addXP(P.xp); S.done[l.id] = 1; commit(); beep('lvl'); Ov.fresh(); }

/* ===================== Prosjektsimulatoren ===================== */
function openSim() {
  const P = { i: -1, m: { ...SIM.start }, pick: null, path: [], order: SIM.rounds.map(() => shuffle([0, 1, 2])), end: null, g: 0, xp: 0, delta: null, stop: false, over: false }, ov = { label: SIM.t };
  const meters = () => `<div class="meters">${['f', 'o', 'l', 'b'].map(k => { const v = clamp(P.m[k], 0, 100), d = P.delta && P.delta[k]; return `<div class="meter${v <= 20 ? ' low' : ''}"><span>${SIM.names[k]}${d ? `<em class="${d > 0 ? 'up' : 'dn'}">${d > 0 ? '+' : ''}${d}</em>` : ''}</span><div class="mbar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${v}" aria-label="${SIM.names[k]}"><i style="width:${v}%"></i></div></div>`; }).join('')}</div>`;
  function finish() { let g = Math.round(clamp(P.m.f, 0, 100) * clamp(P.m.o, 0, 100) / 100); P.over = P.m.b < 0; if (P.over) g = Math.max(0, g - 15); if (P.stop) g = 0;
    P.end = P.stop ? 'stanset' : g >= 65 ? 'hoy' : g >= 40 ? 'middels' : P.m.f >= 60 ? 'ubrukt' : 'lite'; P.g = g; P.xp = 60 + g; P.delta = null; addXP(P.xp); S.stat.sims++; S.done.sim = Math.max(S.done.sim ?? 0, g); commit(); beep('lvl'); }
  ov.render = () => {
    if (P.end) { const [h, txt] = SIM.ends[P.end], steps = P.path.filter(p => p.ok).length;
      return ovTop(`<strong>${SIM.t}</strong>`) + `<div class="ov-body" tabindex="-1"><div class="col end"><p class="bigno">${P.g}<span> i gevinst</span></p><h2>${esc(h)}</h2><p>${esc(txt)}</p>${P.over && !P.stop ? `<p>Budsjettet sprakk, og det trekker ned gevinsten.</p>` : ''}<p class="xpline">${icon('bolt', 18)} +${P.xp} XP</p>${meters()}
        <h3>Veien du valgte</h3><ol class="path">${P.path.map(p => `<li class="${p.ok ? 'ok' : ''}"><strong>${esc(p.t)}</strong><span>${esc(p.k)}</span></li>`).join('')}</ol><p>Du dekket ${steps} av Kotters åtte trinn.</p><div class="teori"><p>${esc(SIM.moral)}</p></div></div></div>
        <div class="ov-foot"><button class="btn wide" data-act="again">Spill en gang til</button><button class="btn ghost wide" data-act="close">Ferdig</button></div>`; }
    if (P.i < 0) return ovTop(`<strong>${SIM.t}</strong>`) + `<div class="ov-body" tabindex="-1"><div class="col"><article class="kort"><p class="zl">${esc(SIM.sub)}</p><h2>${esc(SIM.t)}</h2><p>${esc(SIM.intro)}</p></article>${meters()}</div></div><div class="ov-foot"><button class="btn wide" data-act="next">Start måned 1</button></div>`;
    const r = SIM.rounds[P.i], done = P.pick != null, o = done ? r.opts[P.pick] : null;
    return ovTop(progBar(P.i + (done ? 1 : 0), 8), `<span class="cnt">Måned ${P.i + 1}</span>`) + `<div class="ov-body" tabindex="-1"><div class="col">${meters()}<p class="zl">${esc(r.t)}</p><h2 class="qq">${esc(r.s)}</h2>
      <div class="opts">${P.order[P.i].map(ix => `<button class="opt${done ? (ix === P.pick ? ' sel' : ' dimd') : ''}" data-act="choose" data-i="${ix}"${done ? ' disabled' : ''}><span>${esc(r.opts[ix].t)}</span></button>`).join('')}</div>
      ${done ? `<div class="fb ${o.ok ? 'ok' : 'part'}" role="status"><p class="fbh"><strong>${esc(o.k)}</strong></p><p>${esc(o.fb)}</p></div>` : ''}</div></div>
      <div class="ov-foot">${done ? `<button class="btn wide" data-act="next">${P.stop || P.i >= 7 ? 'Se utfallet' : 'Neste måned'}</button>` : `<p class="hint c">Velg ett tiltak denne måneden.</p>`}</div>`;
  };
  ov.act = (a, el) => {
    if (a === 'choose' && P.pick == null && P.i >= 0 && !P.end) { P.pick = +el.dataset.i; const o = SIM.rounds[P.i].opts[P.pick]; P.delta = o.fx; for (const k in o.fx) P.m[k] += o.fx[k]; ['f', 'o', 'l'].forEach(k => { P.m[k] = clamp(P.m[k], 0, 100); });
      P.path.push({ t: SIM.rounds[P.i].t, k: o.k, ok: !!o.ok }); P.stop = P.m.l <= 15; beep(o.ok ? 'ok' : 'bad'); Ov.paint(); const nx = $('[data-act="next"]', Ov.el); nx && nx.focus({ preventScroll: true }); }
    else if (a === 'next') { if (P.i >= 0 && (P.stop || P.i >= 7)) finish(); else { P.i++; P.pick = null; P.delta = null; } Ov.fresh(); }
    else if (a === 'again') { Ov.close(true); openSim(); }
  };
  Ov.open(ov);
}

    const g = P.q[P.i], f = FL(g.f);

      <div class="ov-foot">${P.flip ? `<div class="rate"><button class="btn ghost" data-act="rate" data-v="0">Kunne ikke</button><button class="btn ghost" data-act="rate" data-v="1">Usikker</button><button class="btn" data-act="rate" data-v="2">Kunne</button></div>` : `<button class="btn wide" data-act="flip">Vis forklaringen</button>`}</div>`;
  };

  };

}

VIEWS.tak = () => `<header class="vh"><a class="backl" href="#huset">${icon('back', 18)} Huset</a><p class="zl">Over tolvte etasje</p><h1>Takterrassen</h1><p class="lead">Herfra ser du hele huset. Tre aktiviteter som binder etasjene sammen.</p></header>
  <section class="sec"><h2>Fire briller</h2><p>Samme sak sett gjennom Bolman og Deals fire rammer.</p><div class="rows">${LENS.map(lensRow).join('')}</div></section>
  <section class="rows">${rowBtn('sim', 'flag', 'Prosjektsimulatoren', S.done.sim != null ? `Beste gevinst: ${S.done.sim} av 100` : 'Led en KI-innføring gjennom åtte måneder', '', S.done.sim != null)}${rowBtn('examlist', 'cap', 'Eksamenstrening', `${S.stat.exam} av ${EXAM.length} drøftingsoppgaver gjennomført`, '', S.stat.exam > 0)}${rowBtn('gallery', 'map', 'Modellgalleriet', 'Alle tolv modellene samlet')}</section>`;

VIEWS.profil = () => {
  const lv = level(), st = streak(), span = lv.to ? (S.xp - lv.from) / (lv.to - lv.from) : 1, t = dayIdx(today()), dow = (new Date().getDay() + 6) % 7, s0 = t - dow - 28;
  let cal = ''; for (let i = 0; i < 35; i++) { const d = idxDay(s0 + i), cls = s0 + i > t ? 'fut' : metGoal(d) ? 'on' : S.frz[d] ? 'frz' : (S.days[d] || 0) > 0 ? 'some' : ''; cal += `<i class="${cls}${s0 + i === t ? ' now' : ''}"></i>`; }
  const notes = Object.keys(S.notes).filter(k => S.notes[k]).length;
  return `<header class="vh"><p class="zl">Tittelen din i Skarvøy fylkeskommune</p><h1>${esc(lv.t)}</h1>
      <div class="xpbar" role="progressbar" aria-valuemin="${lv.from}" aria-valuemax="${lv.to || S.xp}" aria-valuenow="${S.xp}" aria-label="Erfaringspoeng"><i style="width:${clamp(span, 0, 1) * 100}%"></i></div>
      <p class="dim">${S.xp} XP. ${lv.to ? `${lv.to - S.xp} igjen til ${esc(lv.next)}.` : 'Du har nådd toppen av huset.'}</p></header>
    <section class="sec"><h2>${st} ${st === 1 ? 'dag' : 'dager'} på rad</h2><p>En dag teller når du når dagsmålet. Jo lengre rekke, jo sterkere nordlys over huset. Du har ${S.fr} ${S.fr === 1 ? 'avspaseringsdag' : 'avspaseringsdager'}. Glipper en dag, brukes den automatisk.</p>
      <div class="cal" aria-hidden="true"><b>M</b><b>T</b><b>O</b><b>T</b><b>F</b><b>L</b><b>S</b>${cal}</div><p class="legend"><span><i class="on"></i> dagsmål nådd</span><span><i class="some"></i> litt aktivitet</span><span><i class="frz"></i> avspasering</span></p></section>
    <section class="sec"><h2>Mestring per etasje</h2><div class="mast">${F.map(f => { const n = lit(f), p = S.done[f.id + 't']; return `<a href="#etasje-${f.n}" aria-label="${f.n}. etasje, ${esc(f.t)}: ${n} av 6 vinduer${p != null ? `, etasjeprøve ${p} prosent` : ''}"><span class="mn">${f.n}</span><span class="mt">${esc(f.t)}</span><span class="mb"><i style="width:${n / 6 * 100}%"></i></span><span class="mpc">${p != null ? p + ' %' : ''}</span></a>`; }).join('')}</div></section>
    <section class="sec"><h2>Merker</h2><p class="dim">${Object.keys(S.badges).length} av ${BADGES.length} er dine.</p><div class="badges">${BADGES.map(b => `<div class="badge${S.badges[b[0]] ? ' on' : ''}">${icon(b[3], 26)}<strong>${esc(b[1])}</strong><span>${esc(b[2])}</span></div>`).join('')}</div></section>
    <section class="sec"><h2>Refleksjonslogg</h2><p>${notes ? `Du har skrevet ${notes} ${notes === 1 ? 'notat' : 'notater'}.` : 'Refleksjonene og disposisjonene dine samles her.'}</p><p class="rowb"><button class="btn ghost" data-act="copynotes"${notes ? '' : ' disabled'}>${icon('copy', 18)} Kopier loggen</button><button class="btn ghost" data-act="dlnotes"${notes ? '' : ' disabled'}>${icon('download', 18)} Last ned</button></p></section>
    <section class="sec"><h2>Innstillinger</h2>
      <fieldset class="seg"><legend>Dagsmål</legend>${[[20, 'Rolig'], [30, 'Jevn'], [60, 'Ivrig']].map(([v, l]) => `<label><input type="radio" name="goal" value="${v}" data-in="goal"${S.goal === v ? ' checked' : ''}><span>${l} <small>${v} XP</small></span></label>`).join('')}</fieldset>
      <fieldset class="seg"><legend>Tekststørrelse</legend>${['Vanlig', 'Større', 'Størst'].map((l, i) => `<label><input type="radio" name="ts" value="${i}" data-in="ts"${S.set.ts === i ? ' checked' : ''}><span>${l}</span></label>`).join('')}</fieldset>
      <label class="sw"><input type="checkbox" id="set-sound" data-in="sound"${S.set.sound ? ' checked' : ''}><span>Lydeffekter</span></label>
      <div class="need-audio blk"><label class="sw"><input type="checkbox" id="set-auto" data-in="auto"${S.set.auto ? ' checked' : ''}><span>Les kortene opp automatisk i rommene</span></label>
        <label class="rng" for="set-rate"><span><strong>Lesehastighet</strong> <output id="rate-out">${S.set.rate.toFixed(1)}</output></span><input type="range" id="set-rate" min="0.7" max="1.5" step="0.1" value="${S.set.rate}" data-in="rate"></label></div>
      <p class="dim no-audio">Opplesning krever en norsk stemme for tekst til tale på enheten. Legg den til i innstillingene for tekst til tale, så dukker valgene opp her.</p>
      </section>
    <section class="sec no-app"><h2>Bruk Organisasjonslære som app</h2><p>Legg appen på hjemskjermen, så åpner den i fullskjerm og virker uten nett.</p>
      <p class="need-install"><button class="btn" data-act="install">${icon('download', 18)} Installer appen</button></p>
      <p class="dim">${Inst.ios() ? 'På iPhone og iPad: Åpne siden i Safari, trykk på Del-knappen og velg «Legg til på Hjem-skjerm».' : 'I Chrome på Android: Åpne menyen med de tre prikkene og velg «Installer app» eller «Legg til på startskjermen».'}</p></section>
    <section class="sec"><h2>Framdrift og sikkerhetskopi</h2><p>Framdriften lagres bare på denne enheten. Ta en sikkerhetskopi før du bytter telefon, eller hvis du vil fortsette på PC. Henter du inn en kopi, slås den sammen med det som allerede ligger her.</p>
      <p class="rowb"><button class="btn ghost" data-act="bksave">${icon('download', 18)} Lagre sikkerhetskopi</button><label class="btn ghost" for="bk-f">Hent inn kopi</label><input type="file" id="bk-f" accept=".json,application/json" class="vh2"></p>
      <div id="rst"><button class="btn quiet danger" data-act="reset1">Nullstill framdriften</button></div></section>
    <section class="sec about"><h2>Om appen</h2><p>${esc(LEARN)}</p><p>Etasjene følger de klassiske hovedtemaene i faget, slik du også finner dem i læreboka til Jacobsen og Thorsvik. Forklaringene er egne sammendrag av kjent faglitteratur og erstatter ikke pensum. Sjekk alltid mot din utgave av boka. Skarvøy fylkeskommune og personene i casene er oppdiktet.</p><p>Appen er uavhengig og ikke tilknyttet forfattere eller forlag. Den er åpen kildekode på <a href="https://github.com/bjoern89/organisasjonslaere">GitHub</a>.</p><p><button class="btn ghost" data-act="howto">Slik virker huset</button></p>
      <h3>Litteratur</h3><ul class="read">${LIT.map(x => `<li>${esc(x)}</li>`).join('')}</ul></section>`;
};

const ARK = { q: '', f: '', tab: 'b' };
function arkList() {
  const q = ARK.q.trim().toLowerCase();
  if (ARK.tab === 'n') { const ws = WHO.filter(w => (!ARK.f || w[2] === ARK.f) && (!q || (w[0] + ' ' + w[1]).toLowerCase().includes(q))); return ws.length ? `<ul class="names">${ws.map(w => `<li><strong>${esc(w[0])}</strong><span>${esc(w[1])} <em class="note">${FL(w[2]).n}. etasje</em></span></li>`).join('')}</ul>` : `<p class="dim">Ingen navn passer med søket.</p>`; }
  const gs = GL.filter(g => (!ARK.f || g.f === ARK.f) && (!q || (g.t + ' ' + g.d).toLowerCase().includes(q)));
  return gs.length ? `<dl class="gloss">${gs.map(g => { const b = (S.cards[g.id] || {}).b || 0; return `<div><dt>${esc(g.t)}<span class="pips" role="img" aria-label="Sitter på nivå ${b} av 5">${[1, 2, 3, 4, 5].map(i => `<i class="${i <= b ? 'on' : ''}"></i>`).join('')}</span></dt><dd>${esc(g.d)} <em class="note">${FL(g.f).n}. etasje</em></dd></div>`; }).join('')}</dl>` : `<p class="dim">Ingen begreper passer med søket.</p>`;
}
VIEWS.arkiv = () => `<header class="vh"><a class="backl" href="#huset">${icon('back', 18)} Huset</a><p class="zl">Kjelleren</p><h1>Arkivet</h1><p class="lead">${GL.length} begreper og ${WHO.length} navn. Prikkene viser hvor godt et begrep sitter.</p></header>
  <div class="arkbar"><div class="tabs2" role="tablist" aria-label="Velg liste"><button role="tab" aria-selected="${ARK.tab === 'b'}" data-act="arktab" data-k="b">Begreper</button><button role="tab" aria-selected="${ARK.tab === 'n'}" data-act="arktab" data-k="n">Navn</button></div>
    <label class="srch" for="ark-q">${icon('search', 18)}<span class="vh2">Søk i arkivet</span><input id="ark-q" type="search" placeholder="Søk i arkivet" value="${esc(ARK.q)}" data-in="arkq" autocomplete="off"></label>
    <label class="vh2" for="ark-f">Etasje</label><select id="ark-f" data-in="arkf"><option value="">Alle etasjer</option>${F.map(f => `<option value="${f.id}"${ARK.f === f.id ? ' selected' : ''}>${f.n}. ${esc(f.t)}</option>`).join('')}</select></div>
  <p class="rowb"><button class="btn" data-act="cards">${icon('cards', 18)} Øv på begreper som venter</button>${ARK.f ? `<button class="btn ghost" data-act="cardsf" data-k="${ARK.f}">Øv på hele etasjen</button>` : ''}</p>
  <div id="ark-list">${arkList()}</div>`;

/* ===================== Handlinger ===================== */
function goKey(k) { const m = k.match(/^(f\d+)(r\d+|k|t|x)$/); if (!m) return; const f = FL(m[1]); if (!f) return;
  if (m[2][0] === 'r') playRoom(f, f.rooms.find(r => r.id === k)); else if (m[2] === 'k') playCase(f.kase, { key: k, f }); else if (m[2] === 't') playTest(f); else openReflect(f); }
function notesText() { let out = '# Refleksjonslogg fra Organisasjonslære\n\n';
  F.forEach(f => { const r = S.notes[f.id + 'x'], m = S.notes[f.id + 'm']; if (r || m) { out += `## ${f.n}. etasje: ${f.t}\n\n`; if (r) out += `Spørsmål: ${f.refl}\n\n${r}\n\n`; if (m) out += `Feltoppdrag: ${f.mission}\n\n${m}\n\n`; } });
  EXAM.forEach((e, i) => { const n = S.notes['ex' + i]; if (n) out += `## Drøfting: ${e.q}\n\n${n}\n\n`; }); return out; }
const ACT = {
  go: el => goKey(el.dataset.k), howto: openHowto, sim: openSim, examlist: openExamList, bksave: backupSave, install: () => Inst.go(),
  daily: () => playQuiz({ title: 'Dagens økt', items: dailyItems(), kind: 'daily' }),
  mix: () => playQuiz({ title: 'Hurtigquiz', items: pick(started().flatMap(authored), 10), kind: 'mix' }),
  mixall: () => playQuiz({ title: 'Hele huset', items: pick(F.flatMap(f => f.quiz), 10), kind: 'mix' }),
  weak: () => { const it = pick(Object.keys(S.q).filter(k => S.q[k][3] === 0 && QI[k]).map(k => QI[k]), 10); if (it.length) playQuiz({ title: 'Svake punkter', items: it, kind: 'mix' }); else toast('Ingen svake punkter akkurat nå.', 'check'); },
  names: () => playQuiz({ title: 'Hvem sa hva?', items: pick(WHO, 8).map(whoQ), kind: 'mix' }),
  cards: () => playCards('Begrepskort', dueTerms(12)),
  cardsf: el => playCards('Begreper: ' + FL(el.dataset.k).t, shuffle(GL.filter(g => g.f === el.dataset.k))),
  gallery: () => openGallery(), lens: el => openLens(el.dataset.k), tool: el => openTool(el.dataset.k),
  term: el => { const g = GL.find(x => x.id === el.dataset.k), box = $('#tdef'); if (!g || !box) return; $$('.chipsl .chipb').forEach(b => { const on = b === el; b.classList.toggle('on', on); b.setAttribute('aria-pressed', on); }); box.innerHTML = `<p><strong>${esc(g.t)}.</strong> ${esc(g.d)}</p>`; },
  arktab: el => { ARK.tab = el.dataset.k; render(false); },
  copynotes: () => copyText(notesText(), 'Loggen er kopiert.'), dlnotes: () => DL.save('refleksjonslogg-organisasjonslaere.md', notesText()),
  reset1: () => { $('#rst').innerHTML = `<p role="alert"><strong>Vil du nullstille?</strong> All framdrift, alle notater og alt du har lagt inn i verktøyene, slettes.</p><p class="rowb"><button class="btn danger" data-act="reset2">Ja, nullstill</button><button class="btn ghost" data-act="reset0">Avbryt</button></p>`; const b = $('[data-act="reset0"]'); b && b.focus(); },
  reset0: () => { $('#rst').innerHTML = `<button class="btn quiet danger" data-act="reset1">Nullstill framdriften</button>`; },
  reset2: () => { S = fresh(); S.rst = Date.now(); CARY = null; save(); applySettings(); location.hash = '#huset'; render(); toast('Framdriften er nullstilt.', 'info'); }
};
const INP = {
  goal: el => { S.goal = +el.value; commit(); }, ts: el => { S.set.ts = +el.value; applySettings(); save(); },
  sound: el => { S.set.sound = el.checked; save(); if (el.checked) beep('ok'); }, auto: el => { S.set.auto = el.checked; save(); },
  rate: el => { S.set.rate = clamp(+el.value || 1, 0.7, 1.5); const o = $('#rate-out'); if (o) o.textContent = S.set.rate.toFixed(1); saveSoon(); },
  arkq: el => { ARK.q = el.value; const l = $('#ark-list'); if (l) l.innerHTML = arkList(); }, arkf: el => { ARK.f = el.value; render(false); const s = $('#ark-f'); s && s.focus(); }
};

/* ===================== Hendelser og oppstart ===================== */
document.addEventListener('click', e => {
  const mp = e.target.closest('.mp[data-part]'); if (mp) return selectPart(mp.closest('.mbox'), mp.dataset.part);
  const mc = e.target.closest('[data-mp]'); if (mc) return selectPart(mc.closest('.mbox'), mc.dataset.mp);
  const el = e.target.closest('[data-act],[data-qa]'); if (!el || el.disabled) return;
  const inOv = !!Ov.cur && Ov.el.contains(el);
  if (el.dataset.qa) { if (inOv && Ov.cur.act) Ov.cur.act(el.dataset.qa, el, e); return; }
  const a = el.dataset.act;
  if (inOv) { if (a === 'close') Ov.close(); else if (Ov.cur.act) Ov.cur.act(a, el, e); return; }
  if (ACT[a]) ACT[a](el, e);
});
document.addEventListener('input', e => { const el = e.target.closest && e.target.closest('[data-in]'); if (!el) return;
  if (Ov.cur && Ov.el.contains(el)) { if (Ov.cur.input) Ov.cur.input(el.dataset.in, el, e); } else if (INP[el.dataset.in]) INP[el.dataset.in](el, e); });
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && Ov.cur) { e.preventDefault(); Ov.close(); return; }
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches && e.target.matches('.mp')) { e.preventDefault(); selectPart(e.target.closest('.mbox'), e.target.dataset.part); return; }
  if (Ov.cur && Ov.cur.key) Ov.cur.key(e);
});
window.addEventListener('hashchange', () => { if (Ov.cur) Ov.close(true); render(); const v = $('#view'); v && v.focus({ preventScroll: true }); });

document.addEventListener('change', e => { if (e.target && e.target.id === 'bk-f') { backupLoad(e.target.files && e.target.files[0]); e.target.value = ''; } });

function start() {
  S = norm(loadLocal()); settle(); applySettings(); Ov.el = $('#ov'); render();
  Aud.init(); Inst.init();
}
start();

</script>
</body>
