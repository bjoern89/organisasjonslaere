<!DOCTYPE html>
<html lang="nb">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Organisasjonslære</title>
<meta name="description" content="Spillifisert læringsapp i organisasjonsteori med caser fra kommunal og fylkeskommunal digitalisering.">
<meta name="theme-color" content="#1C2E49">
<meta name="color-scheme" content="light dark">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Organisasjonslære">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preload" href="fonts/schibsted-grotesk-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
<style>
@font-face{font-family:"Schibsted Grotesk";font-weight:400;font-style:normal;font-display:swap;src:url(fonts/schibsted-grotesk-latin-400-normal.woff2) format("woff2")}
@font-face{font-family:"Schibsted Grotesk";font-weight:400;font-style:italic;font-display:swap;src:url(fonts/schibsted-grotesk-latin-400-italic.woff2) format("woff2")}
@font-face{font-family:"Schibsted Grotesk";font-weight:600;font-style:normal;font-display:swap;src:url(fonts/schibsted-grotesk-latin-600-normal.woff2) format("woff2")}
@font-face{font-family:"Schibsted Grotesk";font-weight:700;font-style:normal;font-display:swap;src:url(fonts/schibsted-grotesk-latin-700-normal.woff2) format("woff2")}
@font-face{font-family:"Sofia Sans Extra Condensed";font-weight:600;font-style:normal;font-display:swap;src:url(fonts/sofia-sans-extra-condensed-latin-600-normal.woff2) format("woff2")}
@font-face{font-family:"Sofia Sans Extra Condensed";font-weight:800;font-style:normal;font-display:swap;src:url(fonts/sofia-sans-extra-condensed-latin-800-normal.woff2) format("woff2")}
</style>
<style>
:root{
  /* Organisasjonslære. Én venstrestilt kolonne. Fasaden er marineblå i begge temaer og er navet i appen.
     Rav er lys i vinduer og framdrift, blått er handling, grønt og rødt er bare riktig og galt. */
  --bg:#EDF1F6; --surface:#FFFFFF; --surface-2:#E1E8F0; --ink:#13233A; --ink-2:#46576E; --line:#C4CFDB;
  --action:#1B4F8F; --on-action:#FFFFFF; --action-soft:#DDE8F5;
  --glow:#F2B33D; --glow-ink:#754700; --glow-soft:#FBEED0; --mark:#B26F00;
  --ok:#17795A; --ok-soft:#DCF1E7; --bad:#B3362B; --bad-soft:#F9E2DF;
  --facade:#1C2E49; --facade-2:#263D5F; --facade-ink:#EAF0F8; --facade-ink-2:#A9B9CF; --pane:#3A5073;
  --sky-1:#1A2D4C; --sky-2:#7E97BF; --aur-k:.6;
  --f-display:"Sofia Sans Extra Condensed","FH Smal",sans-serif;
  --f-body:"Schibsted Grotesk",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r-s:4px; --r-m:8px; --fs:1;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0A1422; --surface:#122035; --surface-2:#0E1A2B; --ink:#E8EEF6; --ink-2:#A8B7CB; --line:#2A3B55;
    --action:#8FBDF5; --on-action:#08121F; --action-soft:#192D49;
    --glow:#F5BC4B; --glow-ink:#F5BC4B; --glow-soft:#38290C; --mark:#F5BC4B;
    --ok:#62D3A4; --ok-soft:#0F3429; --bad:#FF9385; --bad-soft:#43201C;
    --facade:#15263E; --facade-2:#1F3554; --facade-ink:#EAF0F8; --facade-ink-2:#9FB0C8; --pane:#30476A;
    --sky-1:#050B15; --sky-2:#13233D; --aur-k:1;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0A1422; --surface:#122035; --surface-2:#0E1A2B; --ink:#E8EEF6; --ink-2:#A8B7CB; --line:#2A3B55;
  --action:#8FBDF5; --on-action:#08121F; --action-soft:#192D49;
  --glow:#F5BC4B; --glow-ink:#F5BC4B; --glow-soft:#38290C; --mark:#F5BC4B;
  --ok:#62D3A4; --ok-soft:#0F3429; --bad:#FF9385; --bad-soft:#43201C;
  --facade:#15263E; --facade-2:#1F3554; --facade-ink:#EAF0F8; --facade-ink-2:#9FB0C8; --pane:#30476A;
  --sky-1:#050B15; --sky-2:#13233D; --aur-k:1;
  color-scheme:dark;
}

/* Reserve for overskriftsfonten: smalner en lokal font slik at lange ord fortsatt får plass */
@font-face{font-family:"FH Smal";src:local("Arial Narrow"),local("Roboto Condensed"),local("Arial"),local("Roboto"),local("Helvetica Neue"),local("Liberation Sans");size-adjust:74%}

/* ---------- Grunnlag ---------- */
*,*::before,*::after{box-sizing:border-box}
html{height:100%;font-size:calc(100% * var(--fs));-webkit-text-size-adjust:100%}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:1.0625rem;line-height:1.55;overflow-x:hidden}
html.ov-open body{overflow:hidden}
h1,h2,h3,p,ul,ol,dl,dd,figure,blockquote,fieldset{margin:0;padding:0}
h1,h2{font-family:var(--f-display);font-weight:800;line-height:1.02;text-wrap:balance;letter-spacing:.005em}
h1{font-size:2.9rem} h2{font-size:1.85rem} h3{font-size:1rem;font-weight:700;line-height:1.3}
ul,ol{list-style:none} fieldset{border:0;min-width:0}
a{color:var(--action)} button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer} button:disabled{cursor:default}
strong{font-weight:700}
:focus-visible{outline:3px solid var(--mark);outline-offset:2px}
[hidden]{display:none!important}
.vh2{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.skip{position:absolute;left:-999px;top:0;background:var(--surface);padding:.5rem 1rem;z-index:50}
.skip:focus{left:0}
.dim{color:var(--ink-2);font-size:.9375rem}
.err{color:var(--bad);font-weight:600}
.ic{flex:none;vertical-align:-.2em}
.need-audio,.need-install{display:none!important}
.has-audio .need-audio{display:inline-flex!important}
.has-audio .need-audio.blk,.can-install .need-install{display:block!important}
.is-app .no-app{display:none!important}
.has-audio .no-audio{display:none}

/* ---------- Ramme ---------- */
.app{max-width:44rem;margin:0 auto;padding-bottom:5.25rem}
.top{position:sticky;top:0;z-index:5;display:flex;align-items:center;justify-content:space-between;gap:.75rem;padding:.4rem 1rem;background:var(--bg);border-bottom:1px solid var(--line)}
.merke{font:800 1.6rem/1 var(--f-display);color:var(--ink);text-decoration:none;letter-spacing:.01em}
.chips{display:flex;gap:.4rem}
.chip{display:inline-flex;align-items:center;gap:.3rem;min-height:2.1rem;padding:.15rem .65rem;border:1px solid var(--line);border-radius:2rem;background:var(--surface);color:var(--ink);text-decoration:none;font-size:.875rem;font-variant-numeric:tabular-nums}
.chip .ic{color:var(--mark)}
#view{padding:0 1rem 1rem;outline:0;display:flex;flex-direction:column;gap:1.5rem}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;display:flex;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0)}
.tabs a{flex:1;display:flex;flex-direction:column;align-items:center;gap:.1rem;padding:.5rem .1rem .45rem;color:var(--ink-2);text-decoration:none;font-size:.75rem;font-weight:600;min-height:3.4rem;border-top:3px solid transparent;margin-top:-1px}
.tabs a.on{color:var(--action);border-top-color:var(--action)}
@media (min-width:62rem){
  body{padding-left:5.75rem}
  .tabs{top:0;right:auto;width:5.75rem;flex-direction:column;justify-content:center;border-top:0;border-right:1px solid var(--line)}
  .tabs a{flex:none;border-top:0;border-left:3px solid transparent;margin:0;padding:.8rem .1rem}
  .tabs a.on{border-left-color:var(--action)}
  .app{padding-bottom:2rem}
  .toasts{left:5.75rem}
}

/* ---------- Felles byggesteiner ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.5rem;min-height:3rem;padding:.55rem 1.15rem;border:1.5px solid var(--action);border-radius:var(--r-m);background:var(--action);color:var(--on-action);font-weight:700;font-size:1rem;line-height:1.2;text-decoration:none;text-align:center}
.btn.wide{width:100%}
.btn.ghost{background:transparent;color:var(--action)}
.btn.quiet{border-color:transparent;background:transparent;color:var(--action);padding-inline:.25rem;min-height:2.5rem}
.btn.danger{border-color:var(--bad);background:var(--bad);color:var(--surface)} .btn.quiet.danger{background:transparent;border-color:transparent;color:var(--bad)}
.btn:disabled{opacity:.45}
.ib{display:inline-flex;align-items:center;justify-content:center;width:2.75rem;height:2.75rem;flex:none;border:1.5px solid transparent;border-radius:var(--r-m);background:transparent;color:var(--ink)}
.ib:hover{background:var(--surface-2)} .ib.on{color:var(--action);border-color:var(--action);background:var(--action-soft)}
.ib.solid{background:var(--action);color:var(--on-action)}
.tg{min-height:2.25rem;padding:.2rem .7rem;border:1.5px solid var(--line);border-radius:2rem;background:var(--surface);font-size:.8125rem;font-weight:600;color:var(--ink-2)}
.tg.on{border-color:var(--action);background:var(--action-soft);color:var(--action)}
.chipb{display:inline-flex;align-items:center;min-height:2.4rem;padding:.3rem .8rem;border:1.5px solid var(--line);border-radius:2rem;background:var(--surface);font-size:.9375rem;text-align:left;line-height:1.25}
.chipb.on{border-color:var(--glow-ink);background:var(--glow-soft);color:var(--glow-ink);font-weight:700}
.rowb{display:flex;flex-wrap:wrap;gap:.6rem;align-items:center}
.rows{display:flex;flex-direction:column;gap:.5rem}
.rowb2,.door{display:grid;grid-template-columns:auto 1fr auto;gap:.8rem;align-items:center;width:100%;min-height:4rem;padding:.7rem .9rem;border:1px solid var(--line);border-left:.35rem solid var(--line);border-radius:var(--r-s);background:var(--surface);text-align:left;color:var(--ink)}
.rowb2:hover,.door:hover{border-color:var(--action)}
.rowb2.done,.door.done{border-left-color:var(--glow)}
.rowb2>.ic:first-child{color:var(--action)} .rowb2>.ic:last-child,.door>.ic{color:var(--ink-2)}
.dt{display:flex;flex-direction:column;gap:.1rem;min-width:0} .dt strong{line-height:1.25} .dt span{font-size:.875rem;color:var(--ink-2);line-height:1.35}
.rn{font:800 1.9rem/1 var(--f-display);min-width:1.6rem;text-align:center;color:var(--ink-2);font-variant-numeric:tabular-nums}
.rowb2.done .rn{color:var(--mark)}
.blk{display:block}
.sec{display:flex;flex-direction:column;gap:.7rem}
.sec>h2{padding-top:.2rem;border-top:3px solid var(--ink);padding-top:.55rem}
.vh{display:flex;flex-direction:column;gap:.5rem;padding-top:1.1rem}
.zl{font-size:.875rem;font-weight:600;color:var(--ink-2)}
.lead{font-size:1.125rem;max-width:36rem}
.backl{display:inline-flex;align-items:center;gap:.2rem;min-height:2.5rem;font-weight:600;text-decoration:none;align-self:flex-start}
.lbl{display:block;font-weight:700;font-size:.9375rem;margin-top:.3rem}
.ta,.tin,select{width:100%;padding:.65rem .75rem;border:1.5px solid var(--line);border-radius:var(--r-m);background:var(--surface);line-height:1.45}
.ta{resize:vertical;min-height:4.5rem} select{width:auto;padding:.4rem .5rem;min-height:2.5rem}
.ta:focus,.tin:focus{border-color:var(--action)}
.sw{display:flex;gap:.7rem;align-items:flex-start;min-height:2.75rem;padding:.35rem 0;cursor:pointer}
.sw input{width:1.4rem;height:1.4rem;flex:none;margin:.15rem 0 0;accent-color:var(--action)}
.seg{display:flex;flex-wrap:wrap;gap:.4rem;margin:.2rem 0}
.seg legend{font-weight:700;font-size:.9375rem;padding:0 0 .35rem;width:100%}
.seg label{flex:1;min-width:5.5rem;cursor:pointer}
.seg input{position:absolute;opacity:0;width:1px;height:1px}
.seg label span{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:2.75rem;padding:.3rem .5rem;border:1.5px solid var(--line);border-radius:var(--r-m);background:var(--surface);text-align:center;font-weight:600;font-size:.9375rem;line-height:1.2}
.seg small{font-weight:400;color:var(--ink-2);font-size:.8125rem}
.seg input:checked+span{border-color:var(--action);background:var(--action-soft);color:var(--action)}
.seg input:focus-visible+span{outline:3px solid var(--mark);outline-offset:2px}
.seg.sm label span{min-height:2.4rem;font-size:.8125rem}
.rng{display:flex;flex-direction:column;gap:.15rem;padding:.5rem 0}
.rng>span{display:flex;justify-content:space-between;gap:1rem} .rng small{color:var(--ink-2);font-size:.875rem}
.rng input{width:100%;accent-color:var(--action);min-height:2rem} .rng output{font-weight:700;font-variant-numeric:tabular-nums}
.names,.read{display:flex;flex-direction:column;gap:.55rem}
.names li{display:flex;flex-direction:column;padding-left:.8rem;border-left:2px solid var(--line)} .names span{color:var(--ink-2);font-size:.9375rem}
.read li{padding-left:.8rem;border-left:2px solid var(--line);font-size:.9375rem}
.note,em.note{font-style:normal;color:var(--ink-2);font-size:.8125rem}
.sec.note{font-size:1rem;color:var(--ink)}
.chipsl{display:flex;flex-wrap:wrap;gap:.4rem}
.tdef:not(:empty){padding:.7rem .9rem;background:var(--glow-soft);border-radius:var(--r-s);color:var(--ink)}
.pn{display:flex;justify-content:space-between;gap:1rem;border-top:1px solid var(--line);padding-top:.8rem}
.pn a{display:inline-flex;align-items:center;gap:.3rem;min-height:2.75rem;font-weight:600;text-decoration:none}
.toasts{position:fixed;left:0;right:0;top:.6rem;z-index:40;display:flex;flex-direction:column;align-items:center;gap:.4rem;pointer-events:none;padding:0 1rem}
.toast{display:flex;align-items:center;gap:.5rem;max-width:26rem;padding:.6rem .9rem;border-radius:var(--r-m);background:var(--ink);color:var(--bg);font-size:.9375rem;font-weight:600;box-shadow:0 6px 20px rgba(5,11,21,.3);animation:tin .25s ease-out}
.toast.big{background:var(--glow);color:#13233A;font-size:1.0625rem}
.toast.out{opacity:0;transition:opacity .4s}
@keyframes tin{from{transform:translateY(-.6rem);opacity:0}}

/* ---------- Huset ---------- */
.today{display:grid;grid-template-columns:auto 1fr;gap:.6rem 1rem;align-items:center;padding-top:1.1rem}
.today h1{font-size:2.5rem} .today p{margin-top:.25rem}
.tb{grid-column:1/-1;display:flex;flex-direction:column;gap:.5rem}
@media (min-width:34rem){.tb{flex-direction:row}}
.ring .rb{fill:none;stroke:var(--surface-2);stroke-width:7}
.ring .rf{fill:none;stroke:var(--glow);stroke-width:7;stroke-linecap:round;transition:stroke-dashoffset .6s}
.ring .rv{font:800 1.25rem var(--f-body);fill:var(--ink);font-variant-numeric:tabular-nums} .ring .rl{font-size:.5rem;fill:var(--ink-2)}
.sky{position:relative;height:7.5rem;margin:0 -1rem -1.5rem;background:linear-gradient(var(--sky-1),var(--sky-2));overflow:hidden}
.sky::before{content:"";position:absolute;inset:0;background:radial-gradient(1.5px 1.5px at 12% 22%,#fff 50%,transparent 51%),radial-gradient(1px 1px at 31% 12%,#fff 50%,transparent 51%),radial-gradient(1.5px 1.5px at 58% 30%,#fff 50%,transparent 51%),radial-gradient(1px 1px at 74% 14%,#fff 50%,transparent 51%),radial-gradient(1px 1px at 90% 34%,#fff 50%,transparent 51%);opacity:.7}
.au{position:absolute;inset:-45% -15% 5% -15%;background:radial-gradient(55% 55% at 28% 45%,rgba(98,224,160,.95),transparent 70%),radial-gradient(45% 50% at 68% 35%,rgba(110,170,255,.75),transparent 70%),radial-gradient(35% 45% at 52% 60%,rgba(176,124,240,.55),transparent 70%);filter:blur(16px);opacity:calc(var(--aur,.2) * var(--aur-k));animation:drift 18s ease-in-out infinite alternate}
@keyframes drift{from{transform:translateX(-4%) skewX(-6deg)}to{transform:translateX(4%) skewX(7deg)}}
.skilt{position:absolute;left:1rem;bottom:-.42rem;font:800 clamp(2.4rem,13.5vw,3.9rem)/1 var(--f-display);color:var(--glow);letter-spacing:.01em;text-shadow:0 0 22px rgba(245,188,75,.45)}
.bldg{position:relative;margin:0 -1rem;background:var(--facade);color:var(--facade-ink);border-top:5px solid var(--facade-2)}
.shaft{position:absolute;left:.7rem;top:0;bottom:0;width:1rem;background:rgba(3,8,16,.35);border-inline:1px solid var(--facade-2)}
.car{position:absolute;left:1px;right:1px;top:0;height:1.7rem;background:var(--glow);border-radius:2px;box-shadow:0 0 12px rgba(245,188,75,.6);transition:top 1s cubic-bezier(.3,.1,.2,1)}
.fl{display:grid;grid-template-columns:3rem 1fr auto;gap:.6rem;align-items:center;min-height:4.1rem;padding:.45rem 1rem .45rem 2.3rem;border-bottom:1px solid var(--facade-2);color:inherit;text-decoration:none}
.fl:hover,.fl:focus-visible{background:var(--facade-2)}
.fl .no{font:800 2.9rem/1 var(--f-display);color:var(--facade-ink-2);text-align:center;font-variant-numeric:tabular-nums}
.fl.lit .no{color:var(--glow)}
.tx{display:flex;flex-direction:column;min-width:0} .ti{font-weight:700;line-height:1.25} .su{font-size:.8125rem;color:var(--facade-ink-2);line-height:1.3}
.win{display:grid;grid-template-columns:repeat(3,.85rem);gap:.22rem;flex:none}
.win i{height:1rem;background:var(--pane);border-radius:1px}
.win i.on{background:var(--glow);box-shadow:0 0 8px rgba(245,188,75,.65)}
.fl.full .win i.on{animation:glim 3.5s ease-in-out infinite alternate}
@keyframes glim{to{box-shadow:0 0 13px rgba(245,188,75,.95)}}
.fl.sp{background:rgba(3,8,16,.22)} .fl.sp .no{font-size:2.3rem}
.tag{font-size:.75rem;font-weight:700;padding:.2rem .5rem;border-radius:2rem;background:var(--glow);color:#13233A;white-space:nowrap}
.zone{padding:.3rem 1rem .3rem 2.3rem;font-size:.75rem;font-weight:600;color:var(--facade-ink-2);background:var(--facade-2)}
.fot{font-size:.8125rem;color:var(--ink-2);margin-top:-.6rem}

/* ---------- Etasje ---------- */
.fh{display:flex;flex-direction:column;gap:.6rem;padding-top:.6rem}
.fhr{display:grid;grid-template-columns:auto 1fr;gap:.9rem;align-items:end}
.super{font:800 7.6rem/.78 var(--f-display);color:var(--mark);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.fhr h1{font-size:clamp(1.8rem,7.4vw,3.1rem);hyphens:auto;overflow-wrap:anywhere}
.fmeta{display:flex;align-items:center;gap:.7rem;font-size:.875rem;color:var(--ink-2);flex-wrap:wrap}
.fmeta .win i{background:var(--surface-2);outline:1px solid var(--line)} .fmeta .win i.on{background:var(--glow);outline-color:var(--mark)}
.stars{display:flex;gap:.2rem;color:var(--line)} .stars .on{color:var(--mark)} .stars .on .ic{fill:var(--glow)}
.stars.sm{display:inline-flex}
.doors{display:flex;flex-direction:column;gap:.5rem}
.dw{width:.95rem;height:1.25rem;background:var(--surface-2);outline:1px solid var(--line);border-radius:1px}
.door.done .dw{background:var(--glow);outline-color:var(--mark);box-shadow:0 0 8px rgba(245,188,75,.6)}

/* ---------- Økter i fullskjerm ---------- */
.ov{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;background:var(--bg)}
.ov-top{display:flex;align-items:center;gap:.6rem;padding:.35rem .6rem;border-bottom:1px solid var(--line);min-height:3.4rem}
.ov-mid{flex:1;min-width:0;display:flex;align-items:center}
.ov-mid strong{font:800 1.5rem/1 var(--f-display);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cnt{font-size:.8125rem;font-weight:700;color:var(--ink-2);font-variant-numeric:tabular-nums;padding-right:.4rem;white-space:nowrap}
.ov-body{flex:1;overflow-y:auto;padding:1.1rem 1rem 1.5rem;outline:0;-webkit-overflow-scrolling:touch}
.col{max-width:40rem;margin:0 auto;display:flex;flex-direction:column;gap:1rem}
.ov-foot{display:flex;flex-direction:column;gap:.5rem;padding:.6rem 1rem calc(.6rem + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);background:var(--surface)}
.ov-foot:empty{display:none}
.ov-foot>*{max-width:40rem;width:100%;margin-inline:auto}
.ov-foot.two{flex-direction:row;justify-content:center} .ov-foot.two>*{flex:1;margin:0}
.prog,.xpbar,.mbar{height:.5rem;background:var(--surface-2);border-radius:1rem;overflow:hidden}
.prog{flex:1} .xpbar,.mbar{flex:none;width:100%}
.prog i,.xpbar i,.mbar i{display:block;height:100%;background:var(--glow);border-radius:1rem;transition:width .35s}
.segs{display:flex;gap:3px;flex:1} .segs i{flex:1;height:.45rem;background:var(--surface-2);border-radius:1px} .segs i.on{background:var(--glow)} .segs i.cur{background:var(--mark)}
.hint{font-size:.9375rem;color:var(--ink-2)} .hint.c{text-align:center;padding:.6rem 0}

.kort{display:flex;flex-direction:column;gap:.8rem}
.kort>h2{font-size:2.2rem}
.kort p{max-width:65ch}
.praksis,.teori{padding:.75rem .95rem;border-left:.3rem solid var(--action);background:var(--action-soft);border-radius:0 var(--r-s) var(--r-s) 0;display:flex;flex-direction:column;gap:.2rem}
.praksis .lbl,.teori .lbl{margin:0;font-size:.8125rem;color:var(--action)}
.teori{border-left-color:var(--mark);background:var(--glow-soft)} .teori .lbl{color:var(--glow-ink)}
.kilde{font-size:.875rem;color:var(--ink-2)}
.end{align-items:flex-start;padding-top:1rem}
.bigno{font:800 6rem/.85 var(--f-display);color:var(--mark);font-variant-numeric:tabular-nums}
.bigno span{font-size:1.9rem;color:var(--ink-2);letter-spacing:.01em}
.bigno.sm2{font-size:3.6rem} .bigno.sm2 span{font-size:1.4rem}
.xpline{display:inline-flex;align-items:center;gap:.3rem;font-weight:700;color:var(--glow-ink);background:var(--glow-soft);padding:.25rem .7rem;border-radius:2rem}
.take,.missl,.stepl{display:flex;flex-direction:column;gap:.5rem;width:100%}
.take li,.stepl li{padding-left:.8rem;border-left:3px solid var(--glow)}
.stepl{counter-reset:s} .stepl li{counter-increment:s} .stepl li::before{content:counter(s) ". ";font-weight:700}
.missl li{display:flex;flex-direction:column;gap:.15rem;padding:.6rem .8rem;border:1px solid var(--line);border-radius:var(--r-s);background:var(--surface)} .missl span{color:var(--ink-2);font-size:.9375rem}
.lamp{width:4.2rem;height:5.2rem;background:var(--facade);border-radius:2px;padding:.45rem;display:block}
.lamp i{display:block;height:100%;background:var(--glow);box-shadow:0 0 22px rgba(245,188,75,.8);animation:tenn 1.1s ease-out}
.lamp.wait i{animation:puls 1.6s ease-in-out infinite alternate}
@keyframes tenn{0%{background:var(--pane);box-shadow:none}35%{background:var(--glow)}50%{background:var(--pane)}70%,100%{background:var(--glow)}}
@keyframes puls{from{opacity:.35}to{opacity:1}}

/* ---------- Modeller ---------- */
.mbox{display:flex;flex-direction:column;gap:.6rem}
.modell{display:flex;flex-direction:column;gap:.4rem}
.mwrap{overflow-x:auto;padding:.6rem;border:1px solid var(--line);border-radius:var(--r-s);background:var(--surface)}
.msvg{display:block;width:100%;height:auto;max-width:30rem;margin:0 auto;color:var(--ink)}
.msvg text{font:600 12px var(--f-body);fill:currentColor} .msvg .sm{font-size:11px;font-weight:400}
.msvg .ml{stroke:currentColor;stroke-width:1.4;fill:none} .msvg .zig{stroke-width:2}
.msvg .wave{stroke:var(--action);stroke-width:1.5;stroke-dasharray:6 5}
.mp{cursor:pointer;outline:0}
.mp>rect,.mp>ellipse,.mp>polygon,.ms>rect,.ms>polygon{fill:var(--surface-2);stroke:currentColor;stroke-width:1.3}
.ms>rect,.ms>polygon{fill:none;stroke-dasharray:3 3}
.mp>.dash{fill:transparent;stroke-dasharray:5 4} .mp>.hit{fill:transparent;stroke:none}
.mp:hover>rect:not(.dash):not(.hit),.mp:hover>ellipse,.mp:hover>polygon{fill:var(--action-soft)}
.mp:focus-visible>rect,.mp:focus-visible>ellipse,.mp:focus-visible>polygon{stroke:var(--mark);stroke-width:3}
.mp[data-on]>rect:not(.dash):not(.hit),.mp[data-on]>ellipse,.mp[data-on]>polygon{fill:var(--glow);stroke:var(--mark);stroke-width:2}
.mp[data-on]>rect:not(.dash):not(.hit)~text,.mp[data-on]>ellipse~text,.mp[data-on]>polygon~text{fill:#13233A}
.mp[data-on]>.dash{stroke:var(--mark);stroke-width:3;stroke-dasharray:none}
.mp[data-on]>path.ml,.mp[data-on]>polyline.ml{stroke:var(--mark);stroke-width:3}
.mp[data-on]>.hit~text,.mp[data-on]>.dash~text{fill:var(--mark);font-weight:700}
.msvg .pl{fill:var(--surface-2);stroke:var(--line)} .msvg .mid{stroke:var(--line);stroke-dasharray:4 4} .msvg .q{fill:var(--ink-2)}
.sd circle{stroke:var(--ink);stroke-width:1.6;fill:var(--surface)} .sd text{font-size:11px}
.sd.hp circle{fill:var(--ink)} .sd.hp text{fill:var(--bg)} .sd.hn circle{stroke-dasharray:3 2.5}
figcaption{font-size:.875rem;color:var(--ink-2)}
.mchips{display:flex;flex-wrap:wrap;gap:.4rem}
.minfo{padding:.75rem .95rem;background:var(--glow-soft);border-left:.3rem solid var(--mark);border-radius:0 var(--r-s) var(--r-s) 0;min-height:4.6rem;color:var(--ink)}
.minfo h3{margin-bottom:.15rem} .minfo .dim{color:var(--ink-2)}

/* ---------- Spørsmål ---------- */
.from{font-size:.8125rem;font-weight:600;color:var(--ink-2)}
.scen{padding:.75rem .95rem;border-left:.3rem solid var(--ink);background:var(--surface);border-radius:0 var(--r-s) var(--r-s) 0;font-size:1.0625rem}
.qq{font-family:var(--f-body);font-size:1.25rem;font-weight:700;line-height:1.3;letter-spacing:0}
.gap{display:inline-block;min-width:5.5rem;padding:0 .3rem;border-bottom:3px solid var(--mark);color:var(--glow-ink);text-align:center}
.opts{display:flex;flex-direction:column;gap:.5rem}
.opts.two{flex-direction:row} .opts.two .opt{flex:1;justify-content:center}
.opt{display:flex;gap:.6rem;align-items:flex-start;width:100%;min-height:3.25rem;padding:.8rem .9rem;border:1.5px solid var(--line);border-radius:var(--r-m);background:var(--surface);text-align:left;line-height:1.35;color:var(--ink)}
.opt:not(:disabled):hover{border-color:var(--action)}
.opt.sel{border-color:var(--action);background:var(--action-soft)}
.opt.ok,.opt.p2{border-color:var(--ok);background:var(--ok-soft)} .opt.bad,.opt.p0{border-color:var(--bad);background:var(--bad-soft)}
.opt.p1{border-color:var(--mark);background:var(--glow-soft)}
.opt.miss{border-color:var(--ok);border-style:dashed} .opt.dimd{opacity:.55}
.opt:disabled{opacity:1} .opt.dimd:disabled{opacity:.55}
.mk{flex:none;width:1.15rem;display:inline-flex;margin-top:.1rem} .mk:empty{display:none}
.ok>.mk{color:var(--ok)} .bad>.mk{color:var(--bad)} .miss>.mk{color:var(--ok)}
.match{display:grid;grid-template-columns:1fr 1fr;gap:.5rem}
.mcol{display:flex;flex-direction:column;gap:.45rem}
.mitem,.oitem{display:flex;gap:.5rem;align-items:flex-start;width:100%;min-height:3.1rem;padding:.55rem .6rem;border:1.5px solid var(--line);border-radius:var(--r-m);background:var(--surface);text-align:left;font-size:.9375rem;line-height:1.3;color:var(--ink)}
.mitem.sel{border-color:var(--action);background:var(--action-soft)} .mitem.set{border-color:var(--mark)}
.nb{flex:none;display:inline-flex;align-items:center;justify-content:center;width:1.5rem;height:1.5rem;border-radius:50%;background:var(--ink);color:var(--bg);font-size:.8125rem;font-weight:700}
.nb.e{background:transparent;border:1.5px dashed var(--line)}
.ord{display:flex;flex-direction:column;gap:.4rem;counter-reset:o}
.ord li{counter-increment:o;display:flex;gap:.5rem;align-items:center} .ord li::before{content:counter(o);font:800 1.6rem/1 var(--f-display);color:var(--mark);min-width:1.2rem;text-align:center}
.ord .oitem{border-color:var(--mark)}
.pool{display:flex;flex-direction:column;gap:.4rem;padding-top:.6rem;border-top:1px dashed var(--line)} .pool:empty{display:none}
.res{display:flex;flex-direction:column;gap:.4rem}
.res li{display:flex;gap:.55rem;align-items:flex-start;padding:.55rem .7rem;border:1.5px solid;border-radius:var(--r-m);line-height:1.35}
.res li.ok{border-color:var(--ok);background:var(--ok-soft)} .res li.bad{border-color:var(--bad);background:var(--bad-soft)}
.res.num{counter-reset:n} .res.num li{counter-increment:n} .res.num li>span:last-child::before{content:counter(n) ". ";font-weight:700}
.res li>span:last-child{display:block}
.sitem{display:flex;flex-direction:column;gap:.4rem;justify-content:center;min-height:7rem;padding:1rem;border:2px solid var(--line);border-radius:var(--r-m);background:var(--surface);font-size:1.125rem;font-weight:600;text-align:center}
.sitem.ok{border-color:var(--ok);background:var(--ok-soft)} .sitem.bad{border-color:var(--bad);background:var(--bad-soft)}
.sres{font-size:.9375rem;font-weight:700} .sitem.ok .sres{color:var(--ok)} .sitem.bad .sres{color:var(--bad)}
.scats{display:grid;grid-template-columns:1fr 1fr;gap:.5rem} .scats.n3{grid-template-columns:1fr} .scats .btn{min-height:3.4rem}
@media (min-width:30rem){.scats.n3{grid-template-columns:repeat(3,1fr)}}
.fb{padding:.8rem .95rem;border:1.5px solid;border-radius:var(--r-m);display:flex;flex-direction:column;gap:.3rem}
.fb.ok,.fb.p2{border-color:var(--ok);background:var(--ok-soft)} .fb.bad,.fb.p0{border-color:var(--bad);background:var(--bad-soft)} .fb.part,.fb.p1{border-color:var(--mark);background:var(--glow-soft)}
.fbh{display:flex;flex-wrap:wrap;align-items:center;gap:.45rem}
.fb.ok .fbh,.fb.p2 .fbh{color:var(--ok)} .fb.bad .fbh,.fb.p0 .fbh{color:var(--bad)} .fb.part .fbh,.fb.p1 .fbh{color:var(--glow-ink)}
.gain{font-size:.8125rem;font-weight:700;padding:.1rem .5rem;border-radius:2rem;background:var(--surface);color:var(--ink)}
.andre{font-size:.9375rem} .andre summary{cursor:pointer;font-weight:600;color:var(--action);min-height:2.5rem;display:flex;align-items:center} .andre p{margin-top:.5rem;color:var(--ink-2)}

/* ---------- Simulator, kort, briller, veileder ---------- */
.meters{display:grid;grid-template-columns:1fr 1fr;gap:.5rem .9rem;padding:.7rem .8rem;border:1px solid var(--line);border-radius:var(--r-s);background:var(--surface);width:100%}
.meter{display:flex;flex-direction:column;gap:.25rem;font-size:.8125rem;font-weight:600} .meter>span{display:flex;justify-content:space-between}
.meter em{font-style:normal;font-variant-numeric:tabular-nums} em.up{color:var(--ok)} em.dn{color:var(--bad)}
.meter .mbar i{background:var(--action)} .meter.low .mbar i{background:var(--bad)}
.path{display:flex;flex-direction:column;gap:.4rem;width:100%;counter-reset:p}
.path li{counter-increment:p;display:grid;grid-template-columns:1.6rem 1fr;gap:0 .5rem;padding:.45rem .6rem;border:1px solid var(--line);border-left:.3rem solid var(--line);border-radius:var(--r-s);background:var(--surface)}
.path li::before{content:counter(p);grid-row:1/3;font:800 1.5rem/1.1 var(--f-display);color:var(--ink-2)} .path li.ok{border-left-color:var(--glow)} .path span{font-size:.875rem;color:var(--ink-2)}
.flash{display:flex;flex-direction:column;gap:.8rem;justify-content:center;width:100%;min-height:17rem;padding:1.4rem 1.2rem;border:1.5px solid var(--line);border-top:.5rem solid var(--facade);border-radius:var(--r-s);background:var(--surface);text-align:left;color:var(--ink)}
.flash.flip{border-top-color:var(--glow)}
.ft{font:800 2.7rem/1 var(--f-display);hyphens:auto;overflow-wrap:anywhere} .fd{font-size:1.125rem}
.rate{display:grid;grid-template-columns:repeat(3,1fr);gap:.5rem} .rate .btn{padding-inline:.3rem}
.lensb{display:grid;grid-template-columns:1fr 1fr;gap:.5rem}
.lensb button{display:flex;align-items:center;gap:.5rem;min-height:3rem;padding:.5rem .7rem;border:1.5px solid var(--line);border-radius:var(--r-m);background:var(--surface);font-weight:600;text-align:left;color:var(--ink)}
.lensb button.seen{border-color:var(--mark)} .lensb button[aria-selected="true"]{border-color:var(--action);background:var(--action-soft);color:var(--action)}
.lensp{display:flex;flex-direction:column;gap:.3rem;padding:.9rem 1rem;border:1px solid var(--line);border-radius:var(--r-s);background:var(--surface)} .lensp h3{margin-top:.5rem}
.ask{font-style:italic;color:var(--ink-2)}
.chat{gap:.7rem}
.sug{display:flex;flex-direction:column;gap:.4rem;align-items:flex-start}
.ticks{display:flex;flex-direction:column}
.how{display:flex;flex-direction:column;gap:.8rem} .how dt{font-weight:700} .how dd{color:var(--ink-2)}

/* ---------- Verktøy ---------- */
.exn{display:flex;gap:.5rem;align-items:flex-start;padding:.55rem .8rem;border:1.5px dashed var(--mark);border-radius:var(--r-s);font-size:.9375rem;color:var(--glow-ink);background:var(--glow-soft)}
.tlist{display:flex;flex-direction:column;gap:.6rem}
.tlist li{display:flex;flex-direction:column;gap:.4rem;padding:.6rem;border:1px solid var(--line);border-radius:var(--r-s);background:var(--surface)}
.tl1{display:flex;gap:.5rem;align-items:center} .tl1 .tin{flex:1;min-width:0}
.tl2{display:flex;flex-wrap:wrap;gap:.4rem .9rem;align-items:center;font-size:.875rem} .tl2 label,.mini{display:inline-flex;align-items:center;gap:.35rem;font-size:.875rem;white-space:nowrap}
.strat{margin-left:auto;font-weight:700;color:var(--glow-ink);background:var(--glow-soft);padding:.15rem .6rem;border-radius:2rem}
.tug{height:1.1rem;background:var(--ink-2);border-radius:1rem;overflow:hidden;position:relative}
.tug i{display:block;height:100%;background:var(--action);transition:width .35s} .tug::after{content:"";position:absolute;left:50%;top:-2px;bottom:-2px;width:2px;background:var(--bg)}
.tugl{display:flex;justify-content:space-between;font-size:.875rem;font-weight:600}
.ksteps{display:flex;flex-direction:column;gap:.7rem;counter-reset:k}
.ksteps li{counter-increment:k} .ksteps legend::before{content:counter(k) ". "}

/* ---------- Profil og arkiv ---------- */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:.3rem;max-width:20rem}
.cal b{font-size:.6875rem;font-weight:600;color:var(--ink-2);text-align:center}
.cal i,.legend i{display:block;height:1.5rem;background:var(--surface-2);border-radius:2px}
.cal i.on,.legend i.on{background:var(--glow)} .cal i.some,.legend i.some{background:var(--glow-soft);outline:1px solid var(--mark);outline-offset:-1px}
.cal i.frz,.legend i.frz{background:var(--action-soft);outline:1px dashed var(--action);outline-offset:-1px} .cal i.fut{opacity:.35} .cal i.now{box-shadow:0 0 0 2px var(--ink)}
.legend{display:flex;flex-wrap:wrap;gap:.3rem 1rem;font-size:.8125rem;color:var(--ink-2)} .legend span{display:inline-flex;align-items:center;gap:.35rem} .legend i{width:1rem;height:1rem}
.mast{display:flex;flex-direction:column}
.mast a{display:grid;grid-template-columns:1.5rem minmax(0,1fr) 4.5rem 3rem;gap:.6rem;align-items:center;min-height:2.75rem;padding:.2rem 0;border-bottom:1px solid var(--line);color:var(--ink);text-decoration:none;font-size:.9375rem}
.mn{font:800 1.5rem/1 var(--f-display);color:var(--ink-2);text-align:center} .mt{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mb{height:.5rem;background:var(--surface-2);border-radius:1rem;overflow:hidden} .mb i{display:block;height:100%;background:var(--glow)}
.mpc{font-size:.8125rem;color:var(--ink-2);text-align:right;font-variant-numeric:tabular-nums}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(9.5rem,1fr));gap:.5rem}
.badge{display:flex;flex-direction:column;gap:.15rem;padding:.7rem;border:1.5px dashed var(--line);border-radius:var(--r-s);color:var(--ink-2)}
.badge strong{font-size:.9375rem;line-height:1.2} .badge span{font-size:.8125rem;line-height:1.3}
.badge.on{border:1.5px solid var(--mark);background:var(--glow-soft);color:var(--ink)} .badge.on .ic{color:var(--mark)}
.about h3{margin-top:.4rem}
.arkbar{display:flex;flex-wrap:wrap;gap:.5rem;align-items:center}
.tabs2{display:flex;border:1.5px solid var(--line);border-radius:var(--r-m);overflow:hidden}
.tabs2 button{min-height:2.75rem;padding:.3rem 1rem;border:0;background:var(--surface);font-weight:600;color:var(--ink-2)} .tabs2 button[aria-selected="true"]{background:var(--action);color:var(--on-action)}
.srch{flex:1;min-width:11rem;display:flex;align-items:center;gap:.4rem;padding:0 .7rem;border:1.5px solid var(--line);border-radius:var(--r-m);background:var(--surface);color:var(--ink-2)}
.srch input{flex:1;min-width:0;min-height:2.75rem;border:0;background:transparent;color:var(--ink);outline:0} .srch:focus-within{border-color:var(--action)}
.gloss{display:flex;flex-direction:column}
.gloss>div{padding:.65rem 0;border-bottom:1px solid var(--line)}
.gloss dt{display:flex;justify-content:space-between;gap:.8rem;align-items:center;font-weight:700} .gloss dd{color:var(--ink-2);font-size:.9375rem}
.pips{display:inline-flex;gap:.18rem;flex:none} .pips i{width:.45rem;height:.45rem;border-radius:50%;background:var(--surface-2);outline:1px solid var(--line)} .pips i.on{background:var(--glow);outline-color:var(--mark)}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}
}

<script>
'use strict';
/* Organisasjonslære – faginnhold, etasje 1–3.
   Tekstkort har h (overskrift), b (brødtekst), ex (i praksis), fig (modell), src (kilde).
   Spørsmål har ty: mc (a[0] er riktig), tf (sant), multi (ok/no), match (pairs), order (items i riktig rekkefølge),
   sort (cats + items [tekst, kategori]), gap (q med ___, a[0] er riktig). */
const F = [];

F.push({
  n: 1, id: 'f1', zone: 0,
  t: `Hva er en organisasjon?`,
  k: `Organisasjon og organisasjonsteori`,
  intro: `Før du tar heisen videre, trenger du grunnmuren. Hva skiller en organisasjon fra en vennegjeng, hvorfor er fylkeskommunen noe annet enn en bedrift, og hva skal du egentlig med teori?`,
  rooms: [
    { id: 'f1r1', t: `Et system med et oppdrag`, cards: [
      { h: `Hva gjør noe til en organisasjon?`,
        b: `En mye brukt definisjon sier at en organisasjon er **et sosialt system som er bevisst konstruert for å løse oppgaver og nå bestemte mål**. Hvert ledd betyr noe. *Sosialt* fordi mennesker samhandler. *System* fordi delene henger sammen og trenger ressurser utenfra. *Bevisst konstruert* fordi noen har valgt arbeidsdeling og regler. *Mål* fordi organisasjonen finnes for å få noe til.`,
        ex: `Skarvøy fylkeskommune er konstruert for å løse oppgaver som videregående opplæring, fylkesveier, kollektivtransport og tannhelse. Køen på bussholdeplassen deler et mål om å komme fram, men ingen har organisert den.`,
        src: `Definisjonen bygger på Etzioni og brukes i de fleste lærebøker, også hos Jacobsen og Thorsvik.` },
      { h: `Hvorfor organiserer vi oss?`,

F.push({

  t: `Organisasjonskultur`,
  k: `Organisasjonskultur`,
  intro: `Kultur er det som sitter i veggene. Den avgjør hva folk gjør når ingen ser på, og den er grunnen til at samme system kan lykkes i én avdeling og havarere i en annen.`,
  rooms: [
    { id: 'f4r1', t: `Tre nivåer`, cards: [
      { h: `Hva er kultur?`,

        ex: `En nyansatt i Skarvøy foreslår å teste en ny løsning på ekte brukere. Kollegaen svarer: «Det pleier vi ikke. Det må utredes først.» Hun har møtt kulturen.` },
      { h: `Artefakter, verdier og antakelser`,

        why: `Artefakter kan observeres. Uttrykte verdier er det som sies. Antakelsene er det som tas for gitt.` },
      { h: `Hva kulturen gjør for organisasjonen`,
        b: `En sterk kultur gir **tilhørighet** og identitet. Den **koordinerer** uten regler, fordi folk vet hva som forventes. Den skaper **tillit** og senker behovet for kontroll. Baksiden er at sterke kulturer kan bli blinde. Avvikende informasjon siles bort, kritikere tier, og gruppen blir sikrere enn den har grunn til. Sterk kultur er en styrke så lenge antakelsene passer med virkeligheten.`,

    { id: 'f4r2', t: `Mange kulturer i ett hus`, cards: [
      { h: `Subkulturer`,
        b: `Store organisasjoner har **subkulturer** knyttet til enhet, sted og særlig **profesjon**. Lærere, ingeniører, tannleger, jurister og utviklere har lært ulike svar på hva som er godt arbeid. Subkulturer er ikke et problem i seg selv. De bærer fagkvalitet. Problemet oppstår når de ikke forstår hverandres språk og logikk.`,
        ex: `Utvikleren sier: «Vi lanserer og forbedrer underveis.» Juristen hører: «De vil sette i drift noe uferdig.» Begge beskriver ansvarlig praksis i sin profesjon.` },
      { h: `Sosialisering`,
        b: `Kultur overføres gjennom **sosialisering**. Nye medlemmer lærer normene gjennom opplæring, forbilder, historier og reaksjoner på egne feiltrinn. Det meste skjer uformelt. Hva kolleger ler av, hvem som får ros, og hva som blir møtt med stillhet, lærer bort mer enn personalhåndboka.`,
        ex: `Den første uka ser Nora at ingen stiller spørsmål i avdelingsmøtet. Uka etter stiller hun heller ingen. Sosialiseringen tok åtte dager.` },
      { ty: 'mc', q: `Hva lærer nyansatte mest av kulturen gjennom?`,

      { h: `Nasjonale kulturforskjeller`,
        b: `**Hofstede** sammenlignet arbeidsrelaterte verdier på tvers av land. Kjente dimensjoner er **maktdistanse**, **individualisme**, **usikkerhetsunnvikelse** og **maskulinitet**, forstått som konkurranse mot omsorg. Norge skårer lavt på maktdistanse og maskulinitet. Det viser seg som flate strukturer, medvirkning og forventning om å bli hørt. Modellen er kritisert for å overdrive nasjonale gjennomsnitt, men den forklarer en del friksjon i internasjonalt samarbeid.`,
        ex: `En internasjonal leverandør forventer at prosjektlederen beslutter. Den norske prosjektgruppa forventer at alle skal høres først. Begge blir frustrerte uten å vite hvorfor.` },
      { ty: 'mc', q: `Hva sier lav maktdistanse om en arbeidskultur?`,

        why: `Lav maktdistanse betyr at ulikhet i makt er lite akseptert. Medvirkning er normen.` }
    ]},
    { id: 'f4r3', t: `Kan kultur ledes?`, cards: [
      { h: `Noe vi har, eller noe vi er?`,
        b: `To syn står mot hverandre. Det ene ser kultur som noe organisasjonen **har**, en variabel ledelsen kan forme for å nå mål. Det andre ser kultur som noe organisasjonen **er**, et mønster av mening som vokser fram og ikke lar seg designe. Det første synet gir ledere handlekraft. Det andre advarer mot å tro at en verdiplakat endrer noe.`,
        ex: `Ledergruppa vedtar «delingskultur» som verdi. Etter det andre synet endrer vedtaket ingenting før folk erfarer at deling lønner seg, og at det er trygt.`,
        src: `Skillet er kjent fra Linda Smircich (1983).` },
      { h: `Slik former ledere kultur`,
        b: `Schein peker på mekanismer som virker sterkere enn ord. Hva ledere **legger merke til, måler og kontrollerer**. Hvordan de **reagerer på kriser** og feil. Hva de selv **gjør** som rollemodeller. Hvem som blir **ansatt, forfremmet og belønnet**. Medarbeidere leser disse signalene nøye. Stemmer de ikke med verdiene på plakaten, er det signalene som blir trodd.`,
        ex: `Direktøren sier at Skarvøy skal lære av feil. Så feiler en pilot, og prosjektlederen får kjeft i ledermøtet. Hele organisasjonen lærte noe den dagen, og det var ikke det direktøren sa.` },
      { ty: 'mc', q: `En leder vil ha mer utprøving i avdelingen. Hvilket grep former kulturen sterkest?`,
        a: [`Å spørre etter og rose læring fra forsøk som ikke gikk som planlagt`, `Å henge opp en plakat med «Vi tør å feile»`, `Å sende alle på kurs i innovasjon`, `Å skrive utprøving inn i strategien`],
        why: `Det ledere legger merke til og belønner, forteller hva som egentlig gjelder.` },
      { h: `Psykologisk trygghet`,
        b: `**Amy Edmondson** bruker begrepet **psykologisk trygghet** om en felles opplevelse av at det er trygt å ta mellommenneskelig risiko: å spørre, innrømme feil og si imot. Trygghet er ikke det samme som at alle har det koselig. Forskningen hennes viser at trygge team rapporterer flere feil, fordi de tør, og at de lærer mer av dem. For digitalisering er dette avgjørende, siden utprøving alltid gir feil.`,
        ex: `Per-Olav oppdager at KI-assistenten foreslår feil lovhjemmel. I en trygg kultur melder han fra samme dag, og feilen blir rettet. I en utrygg kultur lar han være, eller slutter stille å bruke verktøyet.` },
      { ty: 'tf', q: `Team med høy psykologisk trygghet rapporterer ofte flere feil enn andre team.`, sant: true,

    ]}

    { ty: 'multi', q: `Hvilke mekanismer former kultur sterkest ifølge Schein?`,

  kase: {

    intro: `Ledergruppa i Skarvøy har vedtatt at fylkeskommunen skal ha en «delingskultur». Alle avdelinger skal dele maler, skript og erfaringer i en felles kunnskapsbase. Etter tre måneder ligger det fire dokumenter der. Du blir bedt om å få fart på delingen.`,

        th: `Schein: når uttrykte verdier og atferd spriker, ligger forklaringen i de grunnleggende antakelsene.` },
      { s: `Du har funnet antakelsen: det er risikabelt å vise fram noe som ikke er perfekt. Hva gjør du med den?`,

          [`Jeg innfører krav om minst ett delt dokument per ansatt hver måned.`, 0, `Du får dokumenter, men neppe deling. Kravet inviterer til målforskyvning og bekrefter at deling er kontroll.`]
        ],
        th: `Kultur formes av hva ledere gjør, legger merke til og belønner. Rollemodeller slår verdiplakater.` },
      { s: `Delingen tar seg opp i IKT-seksjonen. Tannhelse og utdanning deler fortsatt ingenting. De sier at basen er «laget av IT, for IT». Hva nå?`,
        opts: [

F.push({
  n: 5, id: 'f5', zone: 1,
  t: `Makt og konflikt`,
  k: `Makt og konflikt i organisasjoner`,
  intro: `Makt er et ord mange unngår, men ingen organisasjon fungerer uten. Her lærer du hvor makt kommer fra, hvordan den brukes uten at det synes, og hvordan konflikter kan håndteres før de vokser.`,
  rooms: [
    { id: 'f5r1', t: `Hvor makten kommer fra`, cards: [
      { h: `Makt og autoritet`,
        b: `En klassisk definisjon fra **Robert Dahl**: A har makt over B i den grad A får B til å gjøre noe B ellers ikke ville gjort. Makt er altså en **relasjon** og ingen egenskap. **Autoritet** er makt som oppfattes som legitim. Weber skilte mellom tradisjonell, karismatisk og legal autoritet. I moderne organisasjoner bygger autoritet på stilling og regler.`,
        ex: `Fylkeskommunedirektøren kan instruere fordi stillingen gir rett til det. En erfaren arkitekt uten lederansvar kan stanse en løsning med ett spørsmål i et møte. Begge har makt, av ulikt slag.` },
      { h: `Maktbaser`,
        b: `**French og Raven** beskrev grunnlag for makt. **Legitim** makt følger stillingen. **Belønningsmakt** bygger på evnen til å gi goder. **Tvangsmakt** bygger på evnen til å straffe. **Ekspertmakt** kommer av kunnskap andre trenger. **Referansemakt** kommer av at andre ser opp til deg. Informasjon regnes ofte som en sjette base. Ekspert- og referansemakt gir som regel mest varig oppslutning.`,
        ex: `Aisha Rahman, personvernombudet, har ingen linjemyndighet. Likevel venter prosjektene på vurderingen hennes. Kunnskap om regelverket gir ekspertmakt, og mandatet gir legitimitet.` },
      { ty: 'match', q: `Koble maktbase og kjennetegn.`,
        pairs: [[`Legitim makt`, `Stillingen gir rett til å beslutte`], [`Ekspertmakt`, `Andre trenger kunnskapen din`], [`Referansemakt`, `Andre ser opp til deg`], [`Belønningsmakt`, `Du kan dele ut goder`], [`Tvangsmakt`, `Du kan iverksette sanksjoner`]],
        why: `Maktbasene til French og Raven beskriver hva makten hviler på.` },
      { h: `Avhengighet og usikkerhet`,
        b: `Makt vokser der andre er **avhengige** av deg. En enhet får makt når den kontrollerer en ressurs som er viktig, knapp og vanskelig å erstatte. Det gjelder penger, kompetanse, informasjon og tilgang. Den som kan **håndtere usikkerhet** for andre, står særlig sterkt. Derfor har drift makt under en krise, og jurister har makt når regelverket er uklart.`,
        ex: `Bare én person i Skarvøy forstår integrasjonen mellom fagsystemet og arkivet. Ingen prosjekter kommer forbi henne. Makten sitter i avhengigheten og ikke i stillingen.`,
        src: `Emerson om avhengighet, Hickson mfl. om strategiske betingelser, Pfeffer og Salancik om ressursavhengighet.` },
      { ty: 'mc', q: `Hvorfor kan en systemforvalter uten lederansvar ha stor makt?`,
        a: [`Andre er avhengige av kunnskap som er vanskelig å erstatte`, `Stillingen står høyt i hierarkiet`, `Vedkommende kan gi lønnsøkning`, `Makt følger alltid ansiennitet`],
        why: `Makt følger avhengighet. Den som sitter på en knapp og viktig ressurs, har makt uansett tittel.` }
    ]},
    { id: 'f5r2', t: `Maktens tre ansikter`, cards: [
      { h: `Den synlige makten`,
        b: `Det første ansiktet er makt i **åpne beslutninger**. To parter vil ulikt, saken kommer opp, og en av dem vinner fram. Denne makten kan observeres ved å se hvem som får viljen sin når interesser står mot hverandre. Det er dette Dahls definisjon fanger.`,
        ex: `Porteføljestyret velger mellom to prosjekter. Samferdsel får sitt, tannhelse får avslag. Makten er synlig i protokollen.` },
      { h: `Makten over dagsordenen`,
        b: `**Bachrach og Baratz** pekte på et andre ansikt: makten til å bestemme **hva som i det hele tatt blir en sak**. Den som styrer sakslisten, kan holde ubehagelige spørsmål borte uten å vinne en eneste votering. Ikke-beslutninger er også beslutninger. Spør derfor hva som aldri kommer opp, og hvem som bestemmer det.`,
        ex: `Forslaget om å avvikle et gammelt fagsystem når aldri porteføljestyret. Sekretariatet vurderer hver gang at saken «ikke er moden». Ingen har stemt nei.` },
      { ty: 'mc', q: `Et kontroversielt forslag blir år etter år sendt «til videre utredning» og kommer aldri til votering. Hvilken form for makt er i sving?`,
        a: [`Dagsordenmakt`, `Belønningsmakt`, `Referansemakt`, `Synlig beslutningsmakt`],
        why: `Å holde en sak borte fra beslutningsarenaen er maktens andre ansikt.` },
      { h: `Makten over tankene`,
        b: `**Steven Lukes** la til et tredje ansikt: makten til å forme hva folk **oppfatter som sine egne interesser**. Når en ordning framstår som naturlig og uten alternativ, oppstår det ingen konflikt å observere. Dette er den minst synlige formen for makt. Den ligger i språk, kategorier og selvfølgeligheter.`,
        ex: `Når alle omtaler innføringen som «en ren teknisk oppgradering», faller spørsmål om endrede arbeidsoppgaver bort av seg selv. Ordvalget har avgjort hva saken handler om.` },

      { h: `Teknologi kan berike eller tømme jobber`,

F.push({

  intro: `Mange endringer gir mindre enn de lovet. Sjelden fordi løsningen var feil, oftere fordi innføring ble forvekslet med utrulling. Her lærer du hva som driver endring, hvorfor motstand er rasjonell, og hvordan endring ledes.`,
  rooms: [
    { id: 'f11r1', t: `Hva er det som endres?`, cards: [
      { h: `Alt henger sammen`,
        b: `**Leavitt** viste at organisasjoner består av fire deler som påvirker hverandre: **oppgaver**, **struktur**, **teknologi** og **mennesker**. Endrer du én, forskyver du de tre andre. Derfor finnes det ingen rene teknologiprosjekter. Ny teknologi endrer hvilke oppgaver som gjøres, hvem som har ansvar, og hvilken kompetanse som trengs.`,
        fig: 'leavitt',
        ex: `Nytt saksbehandlingssystem flytter kontrollarbeid fra arkivet til saksbehandlerne, gjør to ledd i godkjenningen overflødige og krever ny kompetanse. Teknologien var bare ett av fire hjørner.` },
      { h: `Planlagt og fremvoksende endring`,
        b: `**Planlagt endring** har et mål, en plan og noen som leder den. Mye endring skjer likevel uten plan: gjennom små tilpasninger i hverdagen, gjennom press utenfra eller gjennom konflikt. Endringer kan være **inkrementelle**, altså steg for steg, eller **radikale**, altså brudd med det bestående. Lange stabile perioder avbrutt av korte omveltninger er et vanlig mønster.`,
        ex: `Ingen vedtok at Skarvøy skulle bli en organisasjon med hjemmekontor. Det skjedde på to uker i mars 2020. Ti år med planer for fleksibelt arbeid hadde gitt lite.` },
      { ty: 'mc', q: `Et nytt fagsystem innføres uten at noen har tenkt på endrede oppgaver, roller og kompetanse. Hvilken modell advarer mot dette?`,
        a: [`Leavitts diamant`, `Maslows behovshierarki`, `Søppelbøttemodellen`, `Medierikhet`],
        why: `Teknologi er ett av fire hjørner. Rører du ett, flytter de andre seg.` },
      { h: `Lewins tre faser`,
        b: `**Kurt Lewin** beskrev endring som tre faser. **Opptining**: dagens tilstand må oppleves som utilstrekkelig. **Endring**: nye måter prøves ut. **Nedfrysing**: det nye stabiliseres i rutiner, strukturer og kultur. Han beskrev også **kraftfeltet**: enhver situasjon holdes på plass av drivkrefter og motkrefter. Å fjerne motkrefter virker ofte bedre enn å øke presset.`,
        ex: `Skolene bruker ikke den nye vurderingsmodulen. Mer mas øker motstanden. Da kravet om dobbeltføring i det gamle systemet ble fjernet, tok bruken av.` },
      { ty: 'order', q: `Sett Lewins faser i riktig rekkefølge.`,
        items: [`Opptining: dagens situasjon oppleves som utilstrekkelig`, `Endring: nye arbeidsmåter prøves ut`, `Nedfrysing: det nye festes i rutiner og kultur`],
        why: `Uten opptining møter endringen en organisasjon som ikke ser behovet. Uten nedfrysing glir alt tilbake.` }
    ]},
    { id: 'f11r2', t: `Motstand`, cards: [
      { h: `Motstand er rasjonell`,
        b: `Motstand blir ofte forklart med at folk er redde for forandring. Sett fra den enkelte er den som regel fornuftig. Endring kan bety **tap** av kompetanse, status, fellesskap eller trygghet. Den kan gi **ekstra arbeid** i en overgang. Den kan bryte med det folk mener er **faglig riktig**. Og den kan forskyve **makt**. Motstand er dessuten informasjon. De som protesterer, ser ofte svakheter planleggerne har oversett.`,
        ex: `Per-Olav er skeptisk til KI-assistenten. Han har sett den foreslå feil lovhjemmel to ganger. Skepsisen er kvalitetssikring ingen har bedt om.` },
      { h: `Den psykologiske kontrakten`,
        b: `Ved siden av arbeidsavtalen finnes en **psykologisk kontrakt**: uskrevne forventninger om hva den ansatte gir og får. Endringer som bryter kontrakten, oppleves som svik, selv når alt formelt er i orden. Den som ble ansatt for å utøve faglig skjønn, og som får beskjed om å følge systemets forslag, opplever at avtalen er endret uten forhandling.`,
        ex: `Arkivaren valgte yrket for å sikre dokumentasjon for ettertiden. Nå skal hun «forvalte metadata i en automatisert flyt». Tittelen er den samme. Jobben hun sa ja til, er borte.`,
        src: `Begrepet er særlig knyttet til Denise Rousseau.` },
      { ty: 'multi', q: `Hvilke grunner til motstand kan være rasjonelle sett fra den enkelte?`,
        ok: [`Kompetansen min blir mindre verdt`, `Jeg får ekstra arbeid i overgangen`, `Endringen bryter med det jeg mener er faglig riktig`, `Jeg mister innflytelse`],
        no: [`Mennesker er av natur imot alt nytt`, `Motstand skyldes alltid latskap`],
        why: `Motstand har som regel konkrete grunner. De to siste påstandene er forklaringer som stopper analysen.` },
      { h: `Seks måter å møte motstand på`,
        b: `**Kotter og Schlesinger** beskriver seks strategier. **Informasjon og opplæring** når motstanden skyldes manglende kunnskap. **Deltakelse** når de berørte har kunnskap du trenger. **Støtte** når folk er redde. **Forhandling** når noen taper og har makt til å stanse. **Manipulering og kooptering** når annet ikke virker. **Tvang** når det haster. De to siste er raske og har høy pris i tillit.`,
        ex: `Saksbehandlerne kjenner unntakene systemet ikke håndterer. Å bare informere dem er feil strategi. De skal delta, fordi løsningen blir dårligere uten dem.` },
      { ty: 'match', q: `Koble situasjon og strategi.`,
        pairs: [[`De berørte har kunnskap løsningen trenger`, `Deltakelse`], [`Motstanden skyldes manglende kunnskap`, `Informasjon og opplæring`], [`Noen taper og har makt til å stanse`, `Forhandling`], [`Folk er redde og usikre`, `Støtte`], [`Det haster, og du har myndigheten`, `Tvang`]],
        why: `Strategien velges etter årsaken til motstanden, ikke etter hva som er raskest.` }
    ]},
    { id: 'f11r3', t: `Å lede endring`, cards: [
      { h: `Kotters åtte trinn`,
        b: `**John Kotter** beskriver åtte trinn: skap forståelse for at endringen **haster**, bygg en **styrende koalisjon**, utvikle **visjon og strategi**, **kommuniser** visjonen, **fjern hindringer** og gi folk myndighet, skap **kortsiktige gevinster**, **konsolider** og driv videre, og **forankre** det nye i kulturen. De vanligste feilene er å hoppe over starten og å erklære seier for tidlig.`,
        ex: `Systemet er satt i drift, prosjektet feirer med kake og oppløses. Tre måneder senere bruker halvparten gamle regneark ved siden av. Trinn sju og åtte ble aldri gjort.` },
      { ty: 'order', q: `Sett Kotters åtte trinn i riktig rekkefølge.`,
        items: [`Skap forståelse for at det haster`, `Bygg en styrende koalisjon`, `Utvikle visjon og strategi`, `Kommuniser visjonen`, `Fjern hindringer`, `Skap kortsiktige gevinster`, `Konsolider og driv videre`, `Forankre i kulturen`],
        why: `Rekkefølgen er logisk: først vilje og allianser, så retning, så handling, til slutt forankring.` },
      { h: `To veier: E og O`,
        b: `**Beer og Nohria** beskriver to strategier. **Strategi E** søker økonomisk gevinst gjennom struktur og systemer. Den er toppstyrt, planlagt og rask. **Strategi O** bygger organisasjonens evne til å lære. Den er deltakende, fremvoksende og langsom. E gir raske resultater og sliter på tillit. O bygger kultur, men kan mangle retning. De fleste vellykkede endringer kombinerer.`,
        ex: `Sentralisering av lønn og regnskap gjennomføres som E: vedtak, plan, dato. Arbeidet med å få avdelingene til å eie egne digitale tjenester er O: nettverk, læring og tid.` },
      { ty: 'sort', q: `Strategi E eller O?`, cats: [`Strategi E`, `Strategi O`],
        items: [[`Toppstyrt og planlagt`, 0], [`Deltakende og fremvoksende`, 1], [`Målet er økonomisk gevinst`, 0], [`Målet er evne til å lære`, 1], [`Virkemidlene er struktur og systemer`, 0], [`Virkemidlene er kultur og kompetanse`, 1]],
        why: `E står for economic, O for organizational. De utfyller hverandre.` },
      { h: `Fra innføring til gevinst`,
        b: `Kritikken av trinnmodeller er at endring sjelden er lineær og aldri helt ferdig. **Weick og Quinn** beskriver endring som kontinuerlig: små justeringer som hoper seg opp. For digitalisering er lærdommen at oppstart i drift er begynnelsen. **Gevinster** kommer når arbeidsmåter faktisk endres. De må ha en eier i linja, målepunkter og oppfølging etter at prosjektet er slutt.`,
        ex: `Gevinstplanen sier «to årsverk spart». Ingen leder har fått ansvaret for å ta ut gevinsten. Tiden som spares, fylles umerkelig med andre oppgaver. Systemet virker, og gevinsten finnes ikke.` },
      { ty: 'tf', q: `Gevinstene av et nytt system kommer av seg selv når det er satt i drift.`, sant: false,
        why: `Gevinster krever endrede arbeidsmåter, en eier og oppfølging over tid.` }
    ]}
  ],
  quiz: [

    { ty: 'match', q: `Koble navn og bidrag.`,

      why: `Opptining skaper behov. Endring prøver ut. Nedfrysing fester det nye.` },
    { ty: 'mc', q: `Hva må til for at gevinster skal bli realisert etter et digitaliseringsprosjekt?`,

  kase: {
    t: `Oppstart er ikke målet`,
    intro: `Skarvøy innfører nytt sak- og arkivsystem for 1 400 ansatte. Du er endringsansvarlig. Det tekniske prosjektet er i rute.`,
    steps: [
      { s: `Det er tre måneder til oppstart. Hva bruker du mest tid på?`,

          [`Å lage e-læring i alle funksjoner.`, 1, `Opplæring trengs, men den svarer på «hvordan». Folk må først forstå «hvorfor».`],
          [`Å sikre at leverandøren holder tidsplanen.`, 0, `Det er det tekniske prosjektets jobb. Din jobb er det som ikke står i leverandørens plan: menneskene, oppgavene og rollene.`]
        ],
        th: `Lewin og Kotter: endring starter med at dagens situasjon oppleves som utilstrekkelig. Leavitt: teknologi er bare ett av fire hjørner.` },
      { s: `Arkivarene motsetter seg at saksbehandlerne skal journalføre selv. De mener kvaliteten vil falle. Hvilken strategi velger du?`,

          [`Informasjon. Jeg forklarer at endringen er vedtatt.`, 0, `Motstanden skyldes ikke manglende informasjon. De forstår endringen godt og mener den er faglig risikabel.`],
          [`Forhandling. De får beholde journalføringen for de viktigste sakstypene.`, 1, `Et kompromiss som demper konflikten. Du får to parallelle arbeidsmåter og har ikke svart på bekymringen om kvalitet.`]
        ],
        th: `Kotter og Schlesinger: velg strategi etter årsaken til motstanden. Når de berørte har kunnskap du trenger, er deltakelse riktig.` },
      { s: `Systemet er i drift. Styringsgruppa vil avslutte prosjektet. Du ser at mange lagrer dokumenter lokalt og journalfører i ettertid. Hva foreslår du?`,
        opts: [
          [`Vi avslutter som planlagt. Resten er linjas ansvar.`, 0, `Seier erklært for tidlig. Uten oppfølging glir folk tilbake til gamle vaner, og gevinstene uteblir.`],
          [`Vi forlenger innføringen i tre måneder med superbrukere, måling av faktisk bruk og en navngitt gevinsteier i hver avdeling.`, 2, `Sterkt. Du konsoliderer og forankrer. Målingen viser hvor det glipper, og gevinsteierne har ansvaret når prosjektet er borte.`],
          [`Vi sender ut en påminnelse om at lokal lagring ikke er tillatt.`, 1, `Regelen er riktig. En påminnelse endrer likevel sjelden vaner når den gamle måten fortsatt er enklest.`]
        ],
        th: `Kotters trinn sju og åtte: konsolider og forankre. Nedfrysing skjer ikke av seg selv.` }
    ],
    out: [
      `Systemet er i drift, og mange jobber rundt det. Prøv igjen, og husk at teknologi er ett av fire hjørner.`,

  n: 12, id: 'f12', zone: 3,

  intro: `Øverste etasje. Ledelse er det mest omskrevne temaet i faget, og det forskerne er minst enige om. Her lærer du hva ledere faktisk gjør, hvorfor ingen stil alltid virker, og hva som er særegent med å lede i offentlig sektor.`,

        ex: `Marit leder direkte når hun veileder Nora i en vanskelig sak. Hun leder indirekte når hun endrer prioriteringskriteriene i porteføljen. Det siste påvirker flere og varer lenger.` },
      { h: `Hva ledere faktisk gjør`,

        ex: `På én formiddag åpner Marit en fagdag, videreformidler et signal fra direktøren, fordeler to utviklere mellom tre prosjekter og megler mellom drift og utvikling. Fire roller før lunsj.` },

      { h: `Fire funksjoner som må fylles`,

    { id: 'f12r2', t: `Trekk, stil og situasjon`, cards: [
      { h: `Fødes ledere?`,

        ex: `Skarvøy fikk en pris for digitalisering året etter at ny direktør tiltrådte. Avisen ga henne æren. Prosjektene som ga prisen, startet tre år før hun kom.` },
      { h: `Oppgave og relasjon`,

      { ty: 'mc', q: `Hva er de to hoveddimensjonene i klassisk forskning på lederstil?`,

      { h: `Situasjonsbestemt ledelse`,

const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const inl = s => s.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>').replace(/\*(.+?)\*/g, '<em>$1</em>');
const md = s => inl(esc(s));
const plain = s => String(s ?? '').replace(/\*\*?/g, '');
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const pick = (a, n) => shuffle(a).slice(0, n);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const pad = n => String(n).padStart(2, '0');
const dstr = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const today = () => dstr(new Date());
const dayIdx = s => { const [y, m, d] = s.split('-').map(Number); return Math.round(Date.UTC(y, m - 1, d) / 864e5); };
const idxDay = i => { const d = new Date(i * 864e5); return d.getUTCFullYear() + '-' + pad(d.getUTCMonth() + 1) + '-' + pad(d.getUTCDate()); };
const reEsc = s => s.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
const timeout = (p, ms) => Promise.race([p, new Promise((_, rej) => setTimeout(() => rej({ code: 'timeout' }), ms))]);
const flag = (c, on = true) => document.documentElement.classList.toggle(c, on);
function rich(s) { // enkel og trygg markdown for svar fra veilederen
  let out = '', list = false;
  for (const ln of esc(s).split(/\n/)) {
    const li = ln.match(/^\s*(?:[-*•]|\d+[.)])\s+(.*)$/), hd = ln.match(/^#{1,4}\s+(.*)$/);
    if (li) { if (!list) { out += '<ul>'; list = true; } out += '<li>' + inl(li[1]) + '</li>'; continue; }
    if (list) { out += '</ul>'; list = false; }
    if (hd) out += '<p><strong>' + inl(hd[1]) + '</strong></p>'; else if (ln.trim()) out += '<p>' + inl(ln) + '</p>';
  }
  return out + (list ? '</ul>' : '');
}

const fresh = () => ({ v: 1, up: 0, rst: 0, xp: 0, goal: 30, fr: 1, days: {}, frz: {}, done: {}, q: {}, cards: {}, notes: {}, badges: {}, seen: {}, daily: {},
  tools: { used: {} }, stat: { combo: 0, tutor: 0, sims: 0, refl: 0, mis: 0, exam: 0 }, set: { sound: false, rate: 1, auto: false, ts: 0, lb: false } });
function norm(s) { const f = fresh(), o = Object.assign(f, s || {}); for (const k of ['days', 'frz', 'done', 'q', 'cards', 'notes', 'badges', 'seen', 'daily']) if (!o[k] || typeof o[k] !== 'object') o[k] = {};
  o.set = Object.assign(fresh().set, (s || {}).set); o.stat = Object.assign(fresh().stat, (s || {}).stat); o.tools = Object.assign({ used: {} }, (s || {}).tools); if (!o.tools.used) o.tools.used = {}; return o; }
let S = fresh(), MEM = null;
function loadLocal() { try { const t = localStorage.getItem(KEY); if (t) return JSON.parse(t); } catch (e) {} return MEM; }
function saveLocal() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { MEM = S; } }
function save() { S.up = Date.now(); saveLocal(); }
function mergeState(a, b) {
  a = norm(a); b = norm(b);
  const base = (b.up || 0) > (a.up || 0) ? b : a, other = base === a ? b : a;
  if ((base.rst || 0) > (other.up || 0)) return base;
  const o = JSON.parse(JSON.stringify(base));
  o.xp = Math.max(base.xp || 0, other.xp || 0);
  for (const k in other.done) o.done[k] = Math.max(o.done[k] ?? -1, other.done[k]);
  for (const k in other.days) o.days[k] = Math.max(o.days[k] || 0, other.days[k]);
  for (const k in other.frz) o.frz[k] = 1;
  for (const k in other.seen) o.seen[k] = 1;
  for (const k in other.daily) o.daily[k] = 1;
  for (const k in other.badges) if (!o.badges[k]) o.badges[k] = other.badges[k];
  for (const k in other.notes) if (!o.notes[k]) o.notes[k] = other.notes[k];
  for (const k in other.q) { const x = o.q[k], y = other.q[k]; if (!x || (y[0] + y[1]) > (x[0] + x[1])) o.q[k] = y; }
  for (const k in other.cards) { const x = o.cards[k], y = other.cards[k]; if (!x || y.due > x.due) o.cards[k] = y; }
  for (const k in other.tools.used) o.tools.used[k] = 1;
  for (const k in other.stat) o.stat[k] = Math.max(o.stat[k] || 0, other.stat[k] || 0);
  return o;
}

const Aud = { voice: null, ok: false, st: 'idle', tok: 0,
  init() {
    const ss = window.speechSynthesis; if (!ss || typeof SpeechSynthesisUtterance === 'undefined') return;
    const find = () => { let vs = []; try { vs = ss.getVoices(); } catch (e) {}
      const v = vs.find(v => /^nb([-_]|$)/i.test(v.lang)) || vs.find(v => /^(no|nn)([-_]|$)/i.test(v.lang));
      if (v && !this.ok) { this.voice = v; this.ok = true; flag('has-audio'); } };
    find(); try { ss.addEventListener('voiceschanged', find); } catch (e) {}
  },
  changed() { if (Ov.cur && Ov.cur.audio) Ov.cur.audio(); },
  speak(lines) {
    if (!this.ok) return Promise.reject({ code: 'none' });
    const tok = ++this.tok; lines = lines.filter(Boolean).map(s => plain(s).slice(0, 1900));
    try { speechSynthesis.cancel(); } catch (e) {}
    return new Promise((res, rej) => { let k = 0; this.st = 'speaking'; this.changed();
      const nx = () => { if (tok !== this.tok) return rej({ code: 'stopped' }); if (k >= lines.length) { this.st = 'idle'; this.changed(); return res(); }
        const u = new SpeechSynthesisUtterance(lines[k++]); u.voice = this.voice; u.lang = this.voice.lang; u.rate = S.set.rate; u.onend = nx;
        u.onerror = () => { if (tok === this.tok) { this.st = 'idle'; this.changed(); } rej({ code: 'error' }); }; speechSynthesis.speak(u); };
      nx(); });
  },
  stop() { this.tok++; if (this.st === 'idle') return; try { speechSynthesis.cancel(); } catch (e) {} this.st = 'idle'; this.changed(); }
};

/* ===================== Spillmekanikk ===================== */
function level(xp = S.xp) { let i = 0; LEVELS.forEach((l, k) => { if (xp >= l[0]) i = k; }); const nx = LEVELS[i + 1]; return { i, t: LEVELS[i][1], from: LEVELS[i][0], to: nx ? nx[0] : null, next: nx ? nx[1] : null }; }
const metGoal = d => (S.days[d] || 0) >= S.goal;
function streak() { let i = dayIdx(today()), n = 0; if (!metGoal(idxDay(i)) && !S.frz[idxDay(i)]) i--; for (let g = 0; g < 800; g++) { const d = idxDay(i); if (metGoal(d)) n++; else if (!S.frz[d]) break; i--; } return n; }
function settle() { // bruk avspasering på dager som glapp
  const t = dayIdx(today()), ds = [...Object.keys(S.days).filter(metGoal), ...Object.keys(S.frz)].map(dayIdx); if (!ds.length) return;
  const last = Math.max(...ds), gap = t - last - 1; if (gap > 0 && gap <= S.fr) { for (let i = last + 1; i < t; i++) S.frz[idxDay(i)] = 1; S.fr -= gap; saveLocal(); }
}
function addXP(n) {
  if (!(n > 0)) return; const d = today(), was = metGoal(d), lv0 = level().i;
  S.xp += n; S.days[d] = (S.days[d] || 0) + n;
  if (!was && metGoal(d)) { const s = streak(); toast(`Dagsmålet er nådd. ${s} ${s === 1 ? 'dag' : 'dager'} på rad.`, 'aurora'); if (s > 0 && s % 7 === 0 && S.fr < 2) { S.fr++; toast('Du har tjent en avspaseringsdag.', 'sun'); } }
  const lv = level(); if (lv.i > lv0) { toast(`Ny tittel: ${lv.t}`, 'star', true); beep('lvl'); }
}
const WKEYS = f => [f.rooms[0].id, f.rooms[1].id, f.rooms[2].id, f.id + 'k', f.id + 't', f.id + 'x'];
const isLit = (f, k) => k === f.id + 't' ? (S.done[k] || 0) >= 70 : S.done[k] != null;
const lit = f => WKEYS(f).filter(k => isLit(f, k)).length;
const doorName = (f, k) => k === f.id + 'k' ? 'case' : k === f.id + 't' ? 'etasjeprøve' : k === f.id + 'x' ? 'refleksjon' : 'rom ' + (f.rooms.findIndex(r => r.id === k) + 1);
function nextStep() { for (const f of F) for (const k of WKEYS(f)) if (!isLit(f, k)) return { f, key: k, label: `Fortsett: ${f.n}. etasje, ${doorName(f, k)}` }; return null; }
const started = () => { const fs = F.filter(f => f.rooms.some(r => S.done[r.id] != null) || S.done[f.id + 't'] != null); return fs.length ? fs : [F[0]]; };
function award(id) { if (S.badges[id]) return; S.badges[id] = Date.now(); const b = BADGES.find(x => x[0] === id); toast('Nytt merke: ' + b[1], b[3], true); beep('lvl'); }
function checkBadges() {
  const lits = F.map(lit), total = lits.reduce((a, b) => a + b, 0), st = streak();
  if (S.xp > 0) award('start'); if (lits[0] === 6) award('f1'); if (F.every(f => S.seen[f.id])) award('husvarm'); if (lits.some(n => n === 6)) award('etasje');
  if (S.done.f3t === 100) award('weber'); if (S.done.f4t === 100) award('isfjell'); if (S.done.f9t === 100) award('boette');
  if (LENS.every(l => S.done[l.id] != null)) award('briller'); if (S.done.sim != null) award('sim'); if ((S.done.sim || 0) >= 65) award('gevinst');
  if (st >= 7) award('uke'); if (st >= 30) award('maaned'); if (S.stat.mis >= 5) award('felt'); if (S.stat.refl >= 5) award('tenker');
  if (Object.values(S.cards).filter(c => c.b >= 3).length >= 50) award('arkiv'); if (S.stat.combo >= 10) award('kombo');
  if (Object.keys(S.tools.used).length >= 3) award('verktoy'); if (Object.keys(S.tools.used).length >= 5) award('kasse');
  if (F.filter(f => S.done[f.id + 'k'] != null).length >= 6) award('saker'); if (S.stat.exam >= 6) award('eksamen');
  if (F.every(f => (S.done[f.id + 't'] || 0) >= 70)) award('tak'); if (total === 72) award('huset');
}
function commit() { checkBadges(); save(); chips(); }

function dueTerms(n, floors) { const t = dayIdx(today()), fs = new Set((floors || started()).map(f => f.id));
  const seen = GL.filter(g => S.cards[g.id] && S.cards[g.id].due <= t).sort((a, b) => S.cards[a.id].due - S.cards[b.id].due);
  return [...seen, ...GL.filter(g => !S.cards[g.id] && fs.has(g.f))].slice(0, n); }
function srs(id, ok, soft) { const t = dayIdx(today()), c = S.cards[id] || { b: 0, due: t }; c.b = ok ? Math.min(5, c.b + 1) : soft ? Math.max(1, c.b) : 1; c.due = t + (ok ? INT[c.b] : soft ? 1 : 0); S.cards[id] = c; }
function recordQ(q, r) { if (q.id) { const s = S.q[q.id] || [0, 0, 0, 0]; S.q[q.id] = [s[0] + (r.ok ? 1 : 0), s[1] + (r.ok ? 0 : 1), dayIdx(today()), r.ok ? 1 : 0]; } if (q.term) srs(q.term, r.ok); }
const maskDef = g => g.d.replace(new RegExp(reEsc(g.t), 'gi'), '…');
function termQ(g) { const pool = GL.filter(x => x.f === g.f && x.id !== g.id); return { ty: 'mc', q: `Hvilket begrep beskrives?`, s: maskDef(g), a: [g.t, ...pick(pool, 3).map(x => x.t)], why: `**${g.t}**: ${g.d}`, term: g.id, f: g.f }; }
function whoQ(w) { const others = WHO.filter(x => x[0] !== w[0] && !x[0].includes(w[0]) && !w[0].includes(x[0])), ds = [...pick(others.filter(x => x[2] === w[2]), 2), ...pick(others.filter(x => x[2] !== w[2]), 3)].slice(0, 3);
  return { ty: 'mc', q: `Hvem forbindes med dette?`, s: w[1], a: [w[0], ...ds.map(x => x[0])], why: `**${w[0]}**: ${w[1]}.`, f: w[2] }; }
const authored = f => [...f.quiz, ...f.rooms.flatMap(r => r.cards.filter(c => c.ty))];
function dailyItems() {
  const fs = started(), rank = q => { const s = S.q[q.id]; return !s ? 1e6 : s[3] === 0 ? s[2] : 2e6 + s[2]; };
  // etasjeprøvens spørsmål kommer først med når alle rommene på etasjen er lest
  const full = fs.filter(f => f.rooms.every(r => S.done[r.id] != null) || S.done[f.id + 't'] != null);
  let base = fs.flatMap(f => [...(full.includes(f) ? f.quiz : []), ...f.rooms.filter(r => S.done[r.id] != null).flatMap(r => r.cards.filter(c => c.ty))]);
  if (base.length < 5) base = base.concat(fs[fs.length - 1].quiz);
  const pool = shuffle(base).sort((a, b) => rank(a) - rank(b));
  const out = [], per = {}, cap = fs.length > 2 ? 2 : fs.length === 2 ? 3 : 9;
  for (const q of pool) { if (out.length >= 5) break; if ((per[q.f] || 0) >= cap) continue; per[q.f] = (per[q.f] || 0) + 1; out.push(q); }
  return shuffle([...dueTerms(4, full.length ? full : fs).map(termQ), ...out, ...pick(WHO.filter(w => fs.some(f => f.id === w[2])), 1).map(whoQ)]);
}

function makeQ(q, o = {}) {

      : `<p class="hint">Trykk på et nummer til venstre, og så på det som hører til.</p><div class="match"><div class="mcol">${q.pairs.map((p, i) => `<button class="mitem${ui.cur === i ? ' sel' : ''}${ui.map[i] != null ? ' set' : ''}" data-qa="ml" data-i="${i}" aria-pressed="${ui.cur === i}">${nb(i)}<span>${md(p[0])}</span></button>`).join('')}</div><div class="mcol">${ui.r.map((r, k) => { const li = leftOf(k); return `<button class="mitem${li != null ? ' set' : ''}" data-qa="mr" data-i="${k}">${li != null ? nb(li) : '<span class="nb e"></span>'}<span>${md(r.t)}</span></button>`; }).join('')}</div></div>`;

      : `<p class="hint">Trykk på leddene i riktig rekkefølge. Trykk på et valgt ledd for å angre.</p>${ui.out.length ? `<ol class="ord">${ui.out.map((x, k) => `<li><button class="oitem" data-qa="oback" data-i="${k}">${md(x.t)}</button></li>`).join('')}</ol>` : ''}<div class="pool">${ui.pool.map((x, k) => `<button class="oitem p" data-qa="opick" data-i="${k}">${md(x.t)}</button>`).join('')}</div>`;

      const it = ui.items[ui.i]; return `<p class="hint">${ui.i + 1} av ${ui.items.length}</p><div class="sitem ${ui.flash || ''}" role="status">${md(it.t)}${ui.flash ? `<span class="sres">${ui.flash === 'ok' ? 'Riktig' : 'Hører til: ' + esc(q.cats[it.c])}</span>` : ''}</div><div class="scats n${q.cats.length}">${q.cats.map((c, k) => `<button class="btn ghost" data-qa="cat" data-i="${k}"${ui.flash ? ' disabled' : ''}>${esc(c)}</button>`).join('')}</div>`; };

/* ===================== Quiz ===================== */
function playQuiz(cfg) { // cfg: title, items, kind (test|daily|mix|ai), f, again
  const items = cfg.items, P = { i: 0, n: items.length, right: 0, sum: 0, xp: 0, combo: 0, gain: 0, miss: [], qv: null, end: false, bonus: 0, note: '' };
  const ov = { label: cfg.title };

  function answered(r) { const q = items[P.i]; P.sum += r.frac; if (r.ok) { P.right++; P.combo++; } else { P.combo = 0; P.miss.push(q); }

    if (cfg.kind === 'test') { const k = cfg.f.id + 't', prev = S.done[k]; if (pct >= 70 && !(prev >= 70)) { P.bonus = 50; } if (prev != null && pct > prev) award('dobbel'); S.done[k] = Math.max(prev ?? 0, pct);
      P.note = pct >= 70 ? `Prøven er bestått, og vinduet lyser.` : `Du trenger 70 prosent for å tenne vinduet. Se over rommene, og prøv igjen.`; }
    if (cfg.kind === 'daily' && !S.daily[today()]) { S.daily[today()] = 1; P.bonus = 30; P.note = `Dagens økt er gjort.`; }
    if (P.bonus) { addXP(P.bonus); } P.pct = pct; commit(); beep(pct >= 70 ? 'lvl' : 'bad'); }
  ov.render = () => {
    if (P.end) { const p = P.pct, stars = p === 100 ? 3 : p >= 85 ? 2 : p >= 70 ? 1 : 0;
      return ovTop(`<strong>${esc(cfg.title)}</strong>`) + `<div class="ov-body" tabindex="-1"><div class="col end">
        <p class="bigno">${P.right}<span> av ${P.n}</span></p><h2>${p === 100 ? 'Feilfritt' : p >= 85 ? 'Sterkt' : p >= 70 ? 'Godt jobbet' : 'Ikke helt i mål ennå'}</h2>
        ${cfg.kind === 'test' ? `<p class="stars" aria-label="${stars} av 3 stjerner">${[0, 1, 2].map(i => `<span class="${i < stars ? 'on' : ''}">${icon('star', 30)}</span>`).join('')}</p>` : ''}
        ${P.note ? `<p>${esc(P.note)}</p>` : ''}<p class="xpline">${icon('bolt', 18)} +${P.xp + P.bonus} XP</p>
        ${P.miss.length ? `<h3>Se over disse</h3><ul class="missl">${P.miss.map(q => `<li><strong>${md(q.s ? q.s : q.q)}</strong><span>${md(q.why || '')}</span></li>`).join('')}</ul>` : `<p>Alt satt. Disse spørsmålene kommer sjeldnere tilbake.</p>`}
      </div></div><div class="ov-foot"><button class="btn wide" data-act="close">Ferdig</button>${cfg.again ? `<button class="btn ghost wide" data-act="again">Prøv igjen</button>` : ''}</div>`; }
    const q = items[P.i], qv = P.qv, f = q.f && FL(q.f);
    return ovTop(progBar(P.i + (qv.st.done ? 1 : 0), P.n), `<span class="cnt">${P.i + 1}/${P.n}</span>`) +
      `<div class="ov-body" tabindex="-1"><div class="col">${f && cfg.kind !== 'test' ? `<p class="from">${f.n}. etasje, ${esc(f.t)}</p>` : ''}${qv.html()}${qv.st.done ? fbHTML(q, qv.st.res, P.gain, P.combo) : ''}</div></div>` +
      `<div class="ov-foot">${qv.st.done ? `<button class="btn wide" data-act="next">${P.i + 1 < P.n ? 'Neste' : 'Se resultatet'}</button>` : qv.foot()}</div>`;
  };
